<div class="shell"><aside class="side"><div class="brand"><span class="brand-mark">✦</span>Lernflow<small>Dein persönliches Lernstudio</small></div><nav id="nav" class="nav"></nav><div class="sidefoot"><strong>🎯 Wochenziel</strong><div id="side-text" class="hint"></div><div class="progress"><div id="side-progress"></div></div><div class="hint">Nur echte Lernzeit zählt</div></div></aside><main class="main"><header class="top"><div><div class="overline" id="heading-date"></div><h1 id="heading">Dashboard</h1></div><div class="actions"><button class="btn white" onclick="newAction()">＋ Anlegen</button><div class="timerholder"><button class="btn" id="header-timer" onclick="toggleMenu()">▶ Timer ▾</button><div class="timerMenu" id="timer-menu" hidden></div></div></div></header><div id="app"></div><div class="footer">Lernflow · Eigene, unabhängige Lern-App · Alle Daten bleiben in diesem Browser. Erstelle regelmäßig ein Backup.</div></main></div><div class="focusScreen" id="full-timer" hidden></div>
<script>
'use strict';
const KEY='lernflow-local-v1',TIMER_KEY='lernflow-timer-v2';
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const pad=n=>String(n).padStart(2,'0'),today=()=>localDay(new Date()),localDay=x=>{let d=new Date(x);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},dtInput=x=>{let d=new Date(x);return `${localDay(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const minsFmt=m=>`${Math.floor(Math.max(0,m)/60)}h ${pad(Math.round(Math.max(0,m)%60))}m`,clockFmt=s=>`${pad(Math.floor(Math.max(0,s)/3600))}:${pad(Math.floor(Math.max(0,s)%3600/60))}:${pad(Math.floor(Math.max(0,s)%60))}`;
const colors=['#55ddb0','#d980e9','#ffd05b','#74a7ff','#ed9abc'];
const defaults=()=>({subjects:['Baustatik I','BPM','Siedlung I','Hydrologie','Geotechnik I'].map((name,i)=>({id:'s'+i,name,color:colors[i]})),sessions:[],exams:[['s0','2027-02-09'],['s1','2027-02-11'],['s2','2027-02-25'],['s3','2027-02-26'],['s4','2027-03-18']].map(([subject,date])=>({id:uid(),subject,date})),weeklyGoal:20,tasks:[],semesters:[]});
let state;try{let saved=JSON.parse(localStorage.getItem(KEY));state=saved&&Array.isArray(saved.sessions)&&Array.isArray(saved.subjects)?{...defaults(),...saved,tasks:Array.isArray(saved.tasks)?saved.tasks:[],semesters:Array.isArray(saved.semesters)?saved.semesters:[]}:defaults()}catch{state=defaults()}
// Preserve the original Lernflow data key so older sessions and subjects survive the update.
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Lokaler Speicher ist voll oder nicht verfügbar. Bitte ein Backup exportieren.')}updateSide()}
function getSub(id){return state.subjects.find(s=>s.id===id)||{name:'Unbekanntes Fach',color:'#9aa4b5'}}
function minutes(s){return Math.max(0,Number(s.minutes)||0)}
function sessionDay(s){return localDay(s.date)}
function dayM(day){return state.sessions.reduce((n,s)=>n+(sessionDay(s)===day?minutes(s):0),0)}
function monday(x){let d=new Date(x);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function weekM(){let a=monday(new Date()),b=new Date(a);b.setDate(b.getDate()+7);return state.sessions.reduce((n,s)=>{let d=new Date(s.date);return n+(d>=a&&d<b?minutes(s):0)},0)}
function monthM(){let n=new Date();return state.sessions.reduce((v,s)=>{let d=new Date(s.date);return v+(d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()?minutes(s):0)},0)}
function allM(){return state.sessions.reduce((n,s)=>n+minutes(s),0)}
function days(n){let out=[];for(let i=n-1;i>=0;i--){let x=new Date();x.setDate(x.getDate()-i);out.push(localDay(x))}return out}
function sums(){return state.subjects.map(s=>({...s,total:state.sessions.reduce((n,e)=>n+(e.subject===s.id?minutes(e):0),0)}))}
function updateSide(){let v=weekM(),goal=Math.max(1,state.weeklyGoal*60);$('#side-text').textContent=`${minsFmt(v)} von ${state.weeklyGoal}h`;$('#side-progress').style.width=Math.min(100,100*v/goal)+'%'}
let page='dashboard',monthOffset=0,range='week',search='',subjectFilter='',taskFilter='all';let pendingTimerSession=null;
const nav=[['dashboard','◉','Dashboard'],['sessions','◷','Lerneinheiten'],['tasks','☷','Aufgaben'],['semesters','▦','Semesterverwaltung'],['settings','⚙','Einstellungen']];
function go(p){page=p;search='';subjectFilter='';$('#timer-menu').hidden=true;render();window.scrollTo(0,0)}
function render(){let d=new Date();$('#heading-date').textContent=d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})+' · KALENDERWOCHE '+weekNum(d)+' · LERNFLOW';$('#heading').textContent=({dashboard:'Dashboard',sessions:'Lerneinheiten',tasks:'Aufgaben',semesters:'Semesterverwaltung',settings:'Einstellungen'})[page];$('#nav').innerHTML=nav.map(([k,icon,title])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><i>${icon}</i>${title}</button>`).join('');$('#app').innerHTML=({dashboard:dashboard,sessions:sessionsView,tasks:tasksView,semesters:semestersView,settings:settingsView})[page]();updateSide();renderLive()}
function weekNum(d){let t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));return Math.ceil((((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/86400000)+1)/7)}
const card=s=>`<section class="card">${s}</section>`;
function miniCal(){let x=new Date();x.setDate(1);x.setMonth(x.getMonth()+monthOffset);let y=x.getFullYear(),m=x.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();return `<div class="calendarHead"><b>${x.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><div class="flex"><button class="btn alt small" onclick="monthOffset--;render()">‹</button><button class="btn alt small" onclick="monthOffset=0;render()">Heute</button><button class="btn alt small" onclick="monthOffset++;render()">›</button></div></div><div class="monthgrid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="wd">${x}</div>`).join('')}${Array(offset).fill('<div></div>').join('')}${Array.from({length:total},(_,i)=>{let k=`${y}-${pad(m+1)}-${pad(i+1)}`;return `<button title="${esc(minsFmt(dayM(k)))}" onclick="dayInfo('${k}')" class="${dayM(k)?'has':''} ${k===today()?'today':''}">${i+1}${dayM(k)?' ●':''}</button>`}).join('')}</div>`}
function sparkline(){let vals=days(14).map(dayM),max=Math.max(60,...vals),points=vals.map((v,i)=>`${i*300/13},${110-v/max*100}`).join(' ');return `<svg class="spark" viewBox="0 0 300 120" preserveAspectRatio="none"><line x1="0" y1="110" x2="300" y2="110" stroke="#313951"/><polyline fill="none" stroke="#3688ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="${points}"/></svg>`}
function bars(){let keys=range==='month'?days(30):days(7),groups=range==='month'?Array.from({length:5},(_,i)=>keys.slice(i*7,(i+1)*7)):keys.map(k=>[k]);let vals=groups.map(g=>g.reduce((v,k)=>v+dayM(k),0)),max=Math.max(60,...vals);return `<div class="chartbars">${groups.map((g,i)=>`<div class="barcol" title="${esc(minsFmt(vals[i]))}"><span style="height:${Math.max(3,150*vals[i]/max)}px"></span><small>${range==='month'?'W'+(i+1):['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(g[0]+'T12:00:00').getDay()]}</small></div>`).join('')}</div>`}
function distribution(){let rows=sums(),total=rows.reduce((n,s)=>n+s.total,0);let gradient=total?`conic-gradient(${rows.filter(s=>s.total).reduce((a,s)=>{let from=a.last,to=from+s.total/total*100;a.parts.push(`${s.color} ${from}% ${to}%`);a.last=to;return a},{parts:[],last:0}).parts.join(',')})`:'conic-gradient(#293247 0 100%)';return `<div class="donut" style="background:${gradient}"><div><small class="hint">Gesamt</small><b>${minsFmt(total)}</b></div></div><div class="hint" style="text-align:center">Verteilung deiner Lernzeit auf die Fächer</div>`}
function subjectRows(){return sums().map(s=>`<div class="subrow"><span class="dot" style="color:${s.color}"></span><span>${esc(s.name)}</span><strong>${s.total?minsFmt(s.total):'–'}</strong></div>`).join('')}
function dashboard(){let w=weekM(),goal=state.weeklyGoal*60,done=days(7),active=done.filter(x=>dayM(x)>0).length,over=done.filter(x=>dayM(x)>=180).length;let monthDays=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();return `<div class="dashboard-grid">
${card(`<div class="stat3"><div><span class="hint">Heute</span><b>${minsFmt(dayM(today()))}</b><div class="meterline"><span style="width:${Math.min(100,dayM(today())/180*100)}%"></span></div></div><div><span class="hint">Woche</span><b>${minsFmt(w)}</b><div class="meterline"><span style="width:${Math.min(100,w/Math.max(goal,1)*100)}%"></span></div></div><div><span class="hint">Monat</span><b>${minsFmt(monthM())}</b><div class="meterline"><span style="width:${Math.min(100,monthM()/(state.weeklyGoal*60*4.35)*100)}%"></span></div></div></div><div class="line"></div><h3>Erfolgsserie · letzte 7 Tage</h3><div class="weekdots">${done.map(x=>{let m=dayM(x);return `<div class="${m?'hit':x<today()?'miss':''}">${new Date(x+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short'})}<b>${m?'✓':x===today()?'·':'×'}</b></div>`}).join('')}</div><div class="line"></div><div class="labelrow"><h3>Lernverlauf · 14 Tage</h3><span class="hint">${minsFmt(allM())} insgesamt</span></div>${sparkline()}<div class="line"></div><div class="labelrow"><h3>Aktivität im Kalender</h3><span class="hint">${state.sessions.length} Einheiten</span></div>${miniCal()}`)}
${card(`<div class="tabs"><span class="chip">Tag</span><span class="hint">Dein Fortschritt heute</span></div><span class="hint">Lernziel</span><div class="metric">3h <span class="hint" style="font-size:14px">pro Tag (Referenz)</span></div><div class="labelrow"><span class="hint">Heute gelernt</span><b>${minsFmt(dayM(today()))}</b></div><div class="progress"><div style="width:${Math.min(100,dayM(today())/180*100)}%"></div></div><div class="hint">${dayM(today())>=180?'Tagesziel erreicht!':`Noch ${minsFmt(180-dayM(today()))} bis zum 3h-Tagesziel.`}</div><div class="line"></div><div class="labelrow"><h3>Wochenfortschritt</h3><b>${Math.round(w/Math.max(1,goal)*100)}%</b></div><div class="progress"><div style="width:${Math.min(100,w/Math.max(1,goal)*100)}%"></div></div><p class="hint">${minsFmt(w)} von ${state.weeklyGoal}h Wochenziel</p>`)}
${card(`<h2>Insights</h2><div class="two"><div><div class="metric">${Math.round(active/7*100)}%</div><span class="hint">Aktive Tage (7 Tage)</span></div><div><div class="metric">${Math.round(over/7*100)}%</div><span class="hint">Tage mit mindestens 3h</span></div></div><div class="line"></div><div class="two"><div><div class="metric">${state.sessions.length}</div><span class="hint">Lerneinheiten</span></div><div><div class="metric">${state.sessions.length?Math.round(allM()/state.sessions.length):0}m</div><span class="hint">Ø je Einheit</span></div></div>`)}
${card(`<div class="labelrow"><h2>Fächer</h2><span class="chip">${state.subjects.length} Fächer</span></div><div class="stack">${sums().map(s=>`<span style="background:${s.color};width:${allM()?s.total/allM()*100:0}%"></span>`).join('')}</div>${subjectRows()}`)}
${card(`<h2>Aktivitäten</h2>${distribution()}`)}
${card(`<div class="labelrow"><h2>Lernzeit</h2><div class="tabs"><button class="${range==='week'?'active':''}" onclick="range='week';render()">Woche</button><button class="${range==='month'?'active':''}" onclick="range='month';render()">Monat</button></div></div>${bars()}`)}
${card(`<h2>Letzte Lerneinheiten</h2>${state.sessions.length?historyTable([...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4),false):'<div class="empty">Noch keine Einheiten erfasst.</div>'}<button class="btn alt small" style="margin-top:15px" onclick="go('sessions')">Alle Lerneinheiten ansehen</button>`)}
${card(`<h2>Die nächsten Prüfungen</h2>${[...state.exams].filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(e=>`<div class="subrow"><span class="dot" style="color:${getSub(e.subject).color}"></span><span>${esc(getSub(e.subject).name)}</span><strong>${Math.round((new Date(e.date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)} Tage</strong></div>`).join('')||'<div class="empty">Keine kommenden Prüfungen.</div>'}`)}
</div>`}
function historyTable(list,editable=true){return `<div class="tablebox"><table class="history"><thead><tr><th>Datum</th><th>Zeit</th><th>Dauer</th><th>Fach</th><th>Aktivität</th><th>Notiz</th>${editable?'<th>Aktion</th>':''}</tr></thead><tbody>${list.map(s=>{let date=new Date(s.date),end=s.end?new Date(s.end):new Date(date.getTime()+(minutes(s)+(Number(s.breakMinutes)||0))*60000);return `<tr><td>${date.toLocaleDateString('de-DE')}</td><td>${date.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} – ${end.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${minsFmt(minutes(s))}</b>${s.breakMinutes?`<div class="hint">Pause ${minsFmt(s.breakMinutes)}</div>`:''}</td><td><span class="dot" style="color:${getSub(s.subject).color}"></span> ${esc(getSub(s.subject).name)}</td><td>${esc(s.activity||'Lernen')}</td><td class="note" title="${esc(s.note||'')}">${esc(s.note||'–')}</td>${editable?`<td><button class="btn alt small" onclick="editSession('${esc(s.id)}')">Bearbeiten</button> <button class="btn red small" onclick="deleteSession('${esc(s.id)}')">×</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function sessionsView(){let list=[...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(s=>(!subjectFilter||s.subject===subjectFilter)&&(!search||[getSub(s.subject).name,s.activity,s.note,sessionDay(s)].join(' ').toLowerCase().includes(search.toLowerCase())));return `<div class="layout-entry"><section class="card"><h2>Neue Lerneinheit</h2>${sessionForm()}<p class="hint">Nachträgliche Einträge und Pausen werden korrekt getrennt gespeichert.</p></section><section class="card"><div class="labelrow"><h2>Historie</h2><span class="chip">${list.length} Einheiten · ${minsFmt(list.reduce((n,s)=>n+minutes(s),0))}</span></div><div class="filterrow"><input placeholder="Suchen …" value="${esc(search)}" oninput="search=this.value;refreshHistory()" id="history-search"><select onchange="subjectFilter=this.value;refreshHistory()"><option value="">Alle Fächer</option>${state.subjects.map(s=>`<option value="${esc(s.id)}" ${subjectFilter===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div id="history-results">${list.length?historyTable(list):'<div class="empty">Keine passenden Einheiten.</div>'}</div></section></div>`}
function refreshHistory(){let list=[...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(s=>(!subjectFilter||s.subject===subjectFilter)&&(!search||[getSub(s.subject).name,s.activity,s.note,sessionDay(s)].join(' ').toLowerCase().includes(search.toLowerCase())));$('#history-results').innerHTML=list.length?historyTable(list):'<div class="empty">Keine passenden Einheiten.</div>'}
const activities=['Altklausur','Aufgaben bearbeiten','Auswendig lernen','Vorlesung nacharbeiten','Karteikarten','Zusammenfassung','Sonstiges'];
function selectSubs(selected=''){return state.subjects.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}
function sessionForm(s=null){let now=new Date(),start=s?new Date(s.date):new Date(now.getTime()-60*60000),end=s?.end?new Date(s.end):s?new Date(start.getTime()+(minutes(s)+(Number(s.breakMinutes)||0))*60000):now;return `<form onsubmit="submitSession(event,'${s?esc(s.id):''}')"><div class="field"><label>Fach *</label><select name="subject" required>${selectSubs(s?.subject||state.subjects[0]?.id)}</select></div><div class="two"><div class="field"><label>Beginn *</label><input type="datetime-local" name="start" value="${dtInput(start)}" required></div><div class="field"><label>Ende *</label><input type="datetime-local" name="end" value="${dtInput(end)}" required></div></div><div class="field"><label>Pause (Minuten)</label><input name="break" type="number" value="${s?.breakMinutes||0}" min="0" step="1" required></div><div class="field"><label>Aktivität</label><select name="activity">${activities.map(a=>`<option ${s?.activity===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Notiz</label><textarea name="note" rows="3" placeholder="Was hast du gelernt?">${esc(s?.note||'')}</textarea></div><button class="btn white" style="width:100%" type="submit">${s?'Änderungen speichern':'Lerneinheit anlegen'}</button></form>`}
function submitSession(event,id){event.preventDefault();let f=new FormData(event.target),start=new Date(f.get('start')),end=new Date(f.get('end')),pause=Number(f.get('break')),span=(end-start)/60000;if(!Number.isFinite(span)||span<=0||span>1440||pause<0||!Number.isFinite(pause)||pause>=span)return alert('Bitte einen gültigen Zeitraum (max. 24h) und eine kürzere Pause angeben.');let obj={id:id||uid(),subject:f.get('subject'),date:start.toISOString(),end:end.toISOString(),minutes:Math.round(span-pause),breakMinutes:pause,activity:f.get('activity'),note:String(f.get('note')||'')};if(!state.subjects.some(s=>s.id===obj.subject))return alert('Bitte ein Fach wählen.');if(id){let i=state.sessions.findIndex(s=>s.id===id);if(i<0)return;state.sessions[i]=obj;closeDialog()}else state.sessions.push(obj);persist();render()}
function deleteSession(id){if(confirm('Diese Lerneinheit endgültig löschen?')){state.sessions=state.sessions.filter(s=>s.id!==id);persist();render()}}
function editSession(id){let s=state.sessions.find(s=>s.id===id);if(s)dialog(`<h2>Lerneinheit bearbeiten</h2>${sessionForm(s)}`)}
function dayInfo(k){let list=state.sessions.filter(s=>sessionDay(s)===k);dialog(`<h2>${new Date(k+'T12:00:00').toLocaleDateString('de-DE',{dateStyle:'full'})}</h2><p>${minsFmt(dayM(k))} gelernt · ${list.length} Einheiten</p>${list.length?historyTable(list,false):'<p class="hint">Keine Einheiten.</p>'}`)}
function tasksView(){return `<div class="layout-entry"><section class="card"><h2>Neue Aufgabe</h2><form onsubmit="createTask(event)"><div class="field"><label>Aufgabe *</label><input name="title" maxlength="150" required placeholder="z. B. Baustatik GÜ 2"></div><div class="field"><label>Fach</label><select name="subject"><option value="">Ohne Fach</option>${selectSubs()}</select></div><div class="field"><label>Fällig am</label><input type="date" name="due"></div><div class="field"><label>Notiz</label><textarea name="note" rows="3"></textarea></div><button class="btn white" style="width:100%">Anlegen</button></form></section><section class="card"><div class="labelrow"><h2>Meine Aufgaben</h2><div class="tabs"><button class="${taskFilter==='all'?'active':''}" onclick="taskFilter='all';render()">Alle</button><button class="${taskFilter==='open'?'active':''}" onclick="taskFilter='open';render()">Offen</button><button class="${taskFilter==='done'?'active':''}" onclick="taskFilter='done';render()">Erledigt</button></div></div>${state.tasks.filter(t=>taskFilter==='all'||(taskFilter==='done'?t.done:!t.done)).map(t=>`<div class="subrow" style="grid-template-columns:30px 1fr auto"><input type="checkbox" style="width:18px" ${t.done?'checked':''} onchange="toggleTask('${esc(t.id)}')"><span style="${t.done?'text-decoration:line-through;color:#78859a':''}"><strong>${esc(t.title)}</strong><div class="hint">${t.subject?esc(getSub(t.subject).name)+' · ':''}${t.due?esc(t.due)+' · ':''}${esc(t.note||'')}</div></span><button class="btn red small" onclick="removeTask('${esc(t.id)}')">×</button></div>`).join('')||'<div class="empty">Noch keine passenden Aufgaben.</div>'}</section></div>`}
function createTask(e){e.preventDefault();let f=new FormData(e.target);state.tasks.push({id:uid(),title:String(f.get('title')).trim(),subject:f.get('subject'),due:f.get('due'),note:f.get('note'),done:false});persist();render()}
function toggleTask(id){let t=state.tasks.find(t=>t.id===id);if(t)t.done=!t.done;persist();render()}
function removeTask(id){if(confirm('Aufgabe löschen?')){state.tasks=state.tasks.filter(t=>t.id!==id);persist();render()}}

function semestersView(){let list=[...state.semesters].sort((a,b)=>b.start.localeCompare(a.start));return `<div class="layout-entry"><section class="card"><h2>Semester anlegen</h2><p class="hint">Lege Zeiträume für dein Studium fest. Deine bisherigen Lernzeiten bleiben unabhängig davon erhalten.</p><form onsubmit="saveSemester(event)"><div class="field"><label>Semestername *</label><input name="name" maxlength="100" required placeholder="z. B. Wintersemester 2026/27"></div><div class="two"><div class="field"><label>Beginn *</label><input name="start" type="date" required value="2026-09-05"></div><div class="field"><label>Ende *</label><input name="end" type="date" required value="2027-03-31"></div></div><button class="btn white" style="width:100%">Semester anlegen</button></form></section><section class="card"><h2>Meine Semester</h2>${list.map(x=>`<div class="semester-entry"><div><strong>${esc(x.name)}</strong><div class="hint">${formatSemesterDate(x.start)} – ${formatSemesterDate(x.end)}</div></div><div class="flex"><button class="btn alt small" onclick="editSemester('${esc(x.id)}')">Bearbeiten</button><button class="btn red small" onclick="deleteSemester('${esc(x.id)}')">Löschen</button></div></div>`).join('')||'<div class="empty">Noch kein Semester angelegt.</div>'}</section></div>`}
function formatSemesterDate(v){return new Date(v+'T12:00:00').toLocaleDateString('de-DE')}
function saveSemester(e,id=''){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),start=String(f.get('start')||''),end=String(f.get('end')||'');if(!name||!/^\\d{4}-\\d{2}-\\d{2}$/.test(start)||!/^\\d{4}-\\d{2}-\\d{2}$/.test(end)||end<start)return alert('Bitte einen Namen und einen gültigen Zeitraum angeben.');let obj={id:id||uid(),name,start,end};if(id){let i=state.semesters.findIndex(x=>x.id===id);if(i<0)return;state.semesters[i]=obj;closeDialog()}else state.semesters.push(obj);persist();render()}
function editSemester(id){let x=state.semesters.find(a=>a.id===id);if(!x)return;dialog(`<h2>Semester bearbeiten</h2><form onsubmit="saveSemester(event,'${esc(x.id)}')"><div class="field"><label>Semestername *</label><input name="name" maxlength="100" required value="${esc(x.name)}"></div><div class="two"><div class="field"><label>Beginn *</label><input name="start" type="date" required value="${esc(x.start)}"></div><div class="field"><label>Ende *</label><input name="end" type="date" required value="${esc(x.end)}"></div></div><button class="btn white" style="width:100%">Änderungen speichern</button></form>`)}
function deleteSemester(id){if(confirm('Dieses Semester löschen? Lernzeiten bleiben erhalten.')){state.semesters=state.semesters.filter(x=>x.id!==id);persist();render()}}

function settingsView(){return `${card(`<h2>Wochenziel & Fächer</h2><div class="field" style="max-width:260px"><label>Wochenziel in Stunden</label><input type="number" min="1" max="100" id="goal-input" value="${state.weeklyGoal}"></div><button class="btn" onclick="saveGoal()">Ziel speichern</button><div class="line"></div><h3>Fächer verwalten</h3>${state.subjects.map(s=>`<div class="subrow"><span class="dot" style="color:${s.color}"></span><span>${esc(s.name)}</span><button class="btn red small" onclick="removeSubject('${esc(s.id)}')">Entfernen</button></div>`).join('')}<form onsubmit="addSubject(event)" class="flex" style="margin-top:15px"><input name="name" style="flex:1;min-width:160px" required maxlength="70" placeholder="Neues Fach"><input type="color" name="color" value="#3488ff" style="width:55px;height:44px;padding:5px"><button class="btn">Hinzufügen</button></form>`)}<div style="height:16px"></div>${card(`<h2>Datensicherung</h2><p class="hint">Deine Daten werden ausschließlich in diesem Browser auf diesem Gerät gespeichert. Bei Browserwechsel oder gelöschten Websitedaten können sie verloren gehen. Exportiere regelmäßig deine Daten.</p><div class="flex"><button class="btn" onclick="exportData()">↓ JSON-Backup herunterladen</button><label class="btn alt filebtn">↑ Backup importieren<input type="file" accept=".json,application/json" onchange="importData(event)"></label><button class="btn red" onclick="resetAll()">Alles zurücksetzen</button></div><p class="notice">Beim Hochladen einer neuen index.html auf GitHub werden bestehende Lernzeiten normalerweise nicht gelöscht, sofern du denselben Browser und dieselbe Website-Adresse verwendest. Erstelle trotzdem vorher ein Backup.</p>`)}`}
function saveGoal(){let n=Number($('#goal-input').value);if(!Number.isInteger(n)||n<1||n>100)return alert('Bitte 1–100 Stunden eingeben.');state.weeklyGoal=n;persist();render()}
function addSubject(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;state.subjects.push({id:uid(),name,color:f.get('color')});persist();render()}
function removeSubject(id){if(state.subjects.length<=1)return alert('Es muss mindestens ein Fach bleiben.');if(state.sessions.some(s=>s.subject===id)||state.exams.some(e=>e.subject===id))return alert('Dieses Fach ist noch bei Lerneinheiten oder Prüfungen hinterlegt und kann deshalb nicht gelöscht werden.');if(confirm('Fach löschen?')){state.subjects=state.subjects.filter(s=>s.id!==id);persist();render()}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lernflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){let file=e.target.files[0];if(!file)return;file.text().then(x=>{try{let d=JSON.parse(x);if(!Array.isArray(d.subjects)||!Array.isArray(d.sessions)||!Array.isArray(d.exams))throw Error();if(!confirm('Achtung: Die bestehenden Daten mit diesem Backup überschreiben?'))return;state={...defaults(),...d,tasks:Array.isArray(d.tasks)?d.tasks:[],semesters:Array.isArray(d.semesters)?d.semesters:[]};persist();render();alert('Backup importiert.')}catch{alert('Ungültige Backup-Datei.')}})}
function resetAll(){if(confirm('Wirklich alle Lernzeiten, Fächer und Aufgaben löschen?')){state=defaults();persist();render()}}
function dialog(html){let cover=document.createElement('div');cover.id='dialog';cover.style='position:fixed;inset:0;z-index:70;background:#02040ad9;display:grid;place-items:center;padding:12px';cover.innerHTML=`<div class="card" style="width:min(620px,100%);max-height:92vh;overflow:auto"><div class="labelrow" style="margin-bottom:20px"><strong>Lernflow</strong><button class="btn alt small" onclick="closeDialog()">✕ Schließen</button></div>${html}</div>`;cover.addEventListener('click',e=>{if(e.target===cover)closeDialog()});document.body.appendChild(cover)}
function closeDialog(){$('#dialog')?.remove()}
function newAction(){go('sessions');window.scrollTo(0,0)}
// Timer state is stored separately and uses wall-clock timestamps so a page refresh won't lose running time.
let timer;try{timer={mode:'stopwatch',subject:state.subjects[0]?.id||'',activity:'Aufgaben bearbeiten',phase:'idle',focusMs:0,breakMs:0,phaseStarted:0,sessionStarted:0,pomodoroMinutes:25,...JSON.parse(localStorage.getItem(TIMER_KEY)||'{}')}}catch{timer={mode:'stopwatch',subject:state.subjects[0]?.id||'',activity:'Aufgaben bearbeiten',phase:'idle',focusMs:0,breakMs:0,phaseStarted:0,sessionStarted:0,pomodoroMinutes:25}}
function saveTimerState(){try{localStorage.setItem(TIMER_KEY,JSON.stringify(timer))}catch{}}
function focusMs(){return timer.focusMs+(timer.phase==='focus'?Math.max(0,Date.now()-timer.phaseStarted):0)}
function breakMs(){return timer.breakMs+(timer.phase==='break'?Math.max(0,Date.now()-timer.phaseStarted):0)}
function timerDisplay(){let n=timer.mode==='pomodoro'?Math.max(0,timer.pomodoroMinutes*60000-focusMs()):focusMs();return clockFmt(Math.floor(n/1000))}
function timerStatus(){return ({idle:'Bereit zum Lernen',focus:'Lernzeit läuft',break:'Pause läuft – zählt nicht als Lernzeit',paused:'Timer pausiert'})[timer.phase]}
function changeTimerMode(v){if(timer.phase!=='idle'&&(focusMs()||breakMs()))return alert('Bitte zuerst die laufende Einheit speichern oder verwerfen.');timer.mode=v;saveTimerState();renderMenu();renderFullTimer()}
function chooseTimerSubject(v){if(timer.phase!=='idle'&&focusMs()>0)return alert('Fachwechsel ist während einer begonnenen Einheit nicht möglich. Speichere zuerst.');timer.subject=v;saveTimerState();renderMenu();renderFullTimer()}
function focusStart(){if(!state.subjects.some(s=>s.id===timer.subject))timer.subject=state.subjects[0]?.id||'';if(!timer.sessionStarted)timer.sessionStarted=Date.now();if(timer.phase==='focus')return;if(timer.phase==='break')timer.breakMs=breakMs();timer.phase='focus';timer.phaseStarted=Date.now();saveTimerState();renderMenu();renderFullTimer()}
function pauseStart(){if(timer.phase!=='focus')return;if(timer.phase==='focus')timer.focusMs=focusMs();timer.phase='break';timer.phaseStarted=Date.now();saveTimerState();renderMenu();renderFullTimer()}
function pauseAll(){if(timer.phase==='focus')timer.focusMs=focusMs();if(timer.phase==='break')timer.breakMs=breakMs();timer.phase='paused';timer.phaseStarted=0;saveTimerState();renderMenu();renderFullTimer()}
function discardTimer(){if((focusMs()||breakMs())&&!confirm('Timer ohne Speichern verwerfen?'))return;timer.phase='idle';timer.focusMs=0;timer.breakMs=0;timer.phaseStarted=0;timer.sessionStarted=0;saveTimerState();renderMenu();renderFullTimer()}
function finishTimer(){let f=focusMs(),b=breakMs();if(f<30000)return alert('Mindestens 30 Sekunden aktive Lernzeit sind zum Speichern erforderlich.');if(timer.phase==='focus')timer.focusMs=focusMs();if(timer.phase==='break')timer.breakMs=breakMs();timer.phase='paused';timer.phaseStarted=0;saveTimerState();pendingTimerSession={subject:timer.subject,start:new Date(timer.sessionStarted||Date.now()-f-b),end:new Date(),breakMinutes:Math.round(b/60000)};closeFullscreen();$('#timer-menu').hidden=true;timerSaveDialog()}

function timerSaveDialog(){if(!pendingTimerSession)return;let x=pendingTimerSession;dialog(`<div class="labelrow"><h2>Lerneinheit anlegen</h2><button class="btn red small" onclick="cancelPendingTimer()">Timer abbrechen</button></div><form onsubmit="confirmTimerSession(event)"><div class="field"><label>Datum *</label><input type="date" name="day" required value="${localDay(x.start)}"></div><div class="two"><div class="field"><label>Start *</label><input type="time" name="start" required value="${pad(x.start.getHours())}:${pad(x.start.getMinutes())}"></div><div class="field"><label>Ende *</label><input type="time" name="end" required value="${pad(x.end.getHours())}:${pad(x.end.getMinutes())}"></div></div><div class="field"><label>Pause (Minuten)</label><input type="number" name="break" required min="0" step="1" value="${x.breakMinutes}"></div><div class="two"><div class="field"><label>Fach *</label><select name="subject" required>${selectSubs(x.subject)}</select></div><div class="field"><label>Aktivität</label><select name="activity"><option value="">Keine Angabe</option>${activities.map(a=>`<option>${esc(a)}</option>`).join('')}</select></div></div><div class="field"><label>Notiz</label><textarea name="note" rows="3" placeholder="Was hast du gelernt?"></textarea></div><div class="flex" style="justify-content:space-between"><button class="btn alt" type="button" onclick="closeDialog();pendingTimerSession=null">Später speichern</button><button class="btn white" type="submit">Lerneinheit anlegen</button></div></form>`);let el=$('#dialog')?.firstElementChild;if(el)el.className='save-session-dialog'}
function cancelPendingTimer(){if(!confirm('Timer ohne Speichern abbrechen?'))return;pendingTimerSession=null;closeDialog();discardTimer()}
function confirmTimerSession(e){e.preventDefault();let f=new FormData(e.target),day=String(f.get('day')),start=new Date(day+'T'+f.get('start')),end=new Date(day+'T'+f.get('end')),pause=Number(f.get('break'));if(end<=start)end.setDate(end.getDate()+1);let span=(end-start)/60000;if(!Number.isFinite(span)||span<=0||span>1440||!Number.isInteger(pause)||pause<0||pause>=span)return alert('Bitte gültige Uhrzeiten und eine Pause kleiner als die Dauer angeben.');let subject=String(f.get('subject'));if(!state.subjects.some(s=>s.id===subject))return alert('Bitte ein gültiges Fach wählen.');state.sessions.push({id:uid(),subject,date:start.toISOString(),end:end.toISOString(),minutes:Math.round(span-pause),breakMinutes:pause,activity:String(f.get('activity')||''),note:String(f.get('note')||'')});persist();pendingTimerSession=null;timer.phase='idle';timer.focusMs=0;timer.breakMs=0;timer.phaseStarted=0;timer.sessionStarted=0;saveTimerState();closeDialog();render()}

function toggleMenu(){let el=$('#timer-menu');if(!el.hidden){el.hidden=true;return}renderMenu();el.hidden=false}
function renderMenu(){let el=$('#timer-menu');el.innerHTML=`<div class="labelrow"><h2>Fokus-Timer</h2><button class="btn alt small" onclick="$('#timer-menu').hidden=true">✕</button></div><div class="tabs"><button class="${timer.mode==='stopwatch'?'active':''}" onclick="changeTimerMode('stopwatch')">Stoppuhr</button><button class="${timer.mode==='pomodoro'?'active':''}" onclick="changeTimerMode('pomodoro')">Pomodoro</button></div><div class="field"><label>Fach wählen</label><select onchange="chooseTimerSubject(this.value)">${selectSubs(timer.subject)}</select></div><div class="timerClock" style="font-size:52px;margin:15px 0" id="menu-clock">${timerDisplay()}</div><div class="timerLabel" id="menu-status">${timerStatus()}</div><div class="labelrow" style="margin:15px 0"><small>Pause: <b id="menu-break">${clockFmt(Math.floor(breakMs()/1000))}</b></small><button class="btn alt small" onclick="openFullscreen()">⛶ Fokusmodus</button></div><div class="flex" style="justify-content:center"><button class="btn" onclick="focusStart()">${timer.phase==='focus'?'Läuft ✓':'▶ Lernen'}</button>${timer.phase==='focus'?'<button class="btn alt" onclick="pauseStart()">☕ Pause</button>':''}${timer.phase==='break'?'<button class="btn alt" onclick="pauseAll()">⏸ Anhalten</button>':''}<button class="btn white" onclick="finishTimer()">■ Speichern</button></div><p class="hint" style="text-align:center">Pausen werden separat gemessen und abgezogen.</p>`}
function openFullscreen(){$('#timer-menu').hidden=true;$('#full-timer').hidden=false;document.body.classList.add('focus-open');renderFullTimer()}
function closeFullscreen(){$('#full-timer').hidden=true;document.body.classList.remove('focus-open')}
function renderFullTimer(){let el=$('#full-timer');if(el.hidden)return;el.innerHTML=`<div class="focusPanel"><div class="labelrow"><span class="overline">✦ LERNFLOW · FOKUSMODUS</span><button class="btn alt" onclick="closeFullscreen()">✕ Schließen</button></div><div class="hint" style="margin-top:20px">${esc(timerStatus())}</div><div class="timerRing"><div class="timerClock" id="big-clock">${timerDisplay()}</div></div><div style="font-size:19px;font-weight:700">${esc(getSub(timer.subject).name)}</div><div class="timerStats"><div><b id="big-focus">${clockFmt(Math.floor(focusMs()/1000))}</b>Lernzeit</div><div><b id="big-break">${clockFmt(Math.floor(breakMs()/1000))}</b>Pause</div></div><div class="flex" style="justify-content:center"><button class="btn" onclick="focusStart()">▶ ${timer.phase==='focus'?'Läuft':'Lernen / Fortsetzen'}</button>${timer.phase==='focus'?'<button class="btn white" onclick="pauseStart()">☕ Pause starten</button>':''}${timer.phase==='break'?'<button class="btn alt" onclick="pauseAll()">⏸ Anhalten</button>':''}${timer.phase==='focus'?'<button class="btn alt" onclick="pauseAll()">⏸ Anhalten</button>':''}<button class="btn white" onclick="finishTimer()">■ Speichern</button><button class="btn red" onclick="discardTimer()">Verwerfen</button></div><p class="hint">Der Timer bleibt aktiv, wenn du den Fokusmodus schließt.</p></div>`}
function renderLive(){let a=$('#menu-clock');if(a)a.textContent=timerDisplay();let b=$('#menu-break');if(b)b.textContent=clockFmt(Math.floor(breakMs()/1000));let c=$('#menu-status');if(c)c.textContent=timerStatus();let d=$('#big-clock');if(d)d.textContent=timerDisplay();let e=$('#big-focus');if(e)e.textContent=clockFmt(Math.floor(focusMs()/1000));let f=$('#big-break');if(f)f.textContent=clockFmt(Math.floor(breakMs()/1000));$('#header-timer').textContent=timer.phase==='idle'?'▶ Timer ▾':`● ${timerDisplay()} ▾`}
let pomodoroNotified=false;setInterval(()=>{renderLive();if(timer.mode==='pomodoro'&&timer.phase==='focus'&&focusMs()>=timer.pomodoroMinutes*60000&&!pomodoroNotified){pomodoroNotified=true;pauseStart();alert('Pomodoro abgeschlossen! Deine Pause wurde gestartet.')}if(timer.phase==='idle')pomodoroNotified=false},1000);
window.addEventListener('beforeunload',()=>saveTimerState());
render();
</script></body></html>
