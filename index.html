let page='dashboard',monthOffset=0,range='week',search='',subjectFilter='',taskFilter='all',goalPeriod='day',insightsTab='insights';let pendingTimerSession=null;let timerAutoFocus=localStorage.getItem('lernflow-auto-focus')!=='false';

function goalHistory(){
 if(!Array.isArray(state.goalHistory)||!state.goalHistory.length)
  state.goalHistory=[{from:'0001-01-01',goals:[...state.dailyGoals],scope:'legacy'}];

function signedTime(n){return (n<0?'−':n>0?'+':'')+fmtDuration(Math.abs(n))}

 })];

function dateShift(k,n){let d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return localDay(d)}

function targetCard(){let keys=periodDays(goalPeriod),elapsed=keys.filter(k=>k<=today()),minutesDone=keys.reduce((sum,k)=>sum+dayM(k),0),target=keys.reduce((sum,k)=>sum+dailyTarget(k),0),elapsedTarget=elapsed.reduce((sum,k)=>sum+dailyTarget(k),0),units=state.sessions.filter(s=>keys.includes(sessionDay(s))).length,percent=target?Math.round(minutesDone/target*100):0,timePct=target?Math.round(elapsedTarget/target*100):100,remaining=Math.max(0,target-minutesDone),label=goalPeriod==='day'?new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):goalPeriod==='week'?'KW '+weekNum(new Date()):goalPeriod==='month'?new Date().toLocaleDateString('de-DE',{month:'short',year:'2-digit'}):esc(activeSemester().name),totalDays=elapsed.length,active=elapsed.filter(k=>dayM(k)>0).length,needed=elapsedTarget?Math.max(0,elapsedTarget-minutesDone):0;

function monthlyLearning(){let now=new Date(),data=Array.from({length:6},(_,i)=>{let d=new Date(now.getFullYear(),now.getMonth()-5+i,1),year=d.getFullYear(),month=d.getMonth(),total=state.sessions.reduce((sum,s)=>{let t=new Date(s.date);return sum+(t.getFullYear()===year&&t.getMonth()===month?minutes(s):0)},0);return {label:d.toLocaleDateString('de-DE',{month:'short'}),full:d.toLocaleDateString('de-DE',{month:'long',year:'numeric'}),total}}),max=Math.max(60,...data.map(d=>d.total));return `<div class="labelrow"><h2>Lernzeit pro Monat</h2><span class="chip">6 Monate</span></div><div class="monthly-total">${fmtDuration(data[5].total)}<span>im ${esc(data[5].full)} · bisher</span></div><div class="monthly-bars" role="list" aria-label="Lernzeit der letzten sechs Monate">${data.map((d,i)=>`<div class="monthly-column" role="listitem" aria-label="${esc(d.full)}: ${fmtDuration(d.total)}"><strong>${fmtDuration(d.total)}</strong><div class="monthly-rail"><span style="height:${d.total?Math.max(3,100*d.total/max):0}%;background:${i===5?'#55ddb0':'#4773a7'}"></span></div><small>${esc(d.label)}</small></div>`).join('')}</div><p class="hint">Deine erfasste Lernzeit, ohne Pausen. Der aktuelle Monat läuft noch.</p>`}

function progressSemester(){let sem=activeSemester(),series=semesterBalance(sem),done=series.slice(1).map(p=>p.day),values=series.map(p=>p.balance/60);let low=Math.min(-1,...values),high=Math.max(1,...values),padY=Math.max(1,(high-low)*.12);low-=padY;high+=padY;let w=860,h=260,marg=45,innerW=w-2*marg,innerH=h-2*marg,x=i=>marg+i/(Math.max(1,values.length-1))*innerW,y=v=>marg+(high-v)/(high-low)*innerH;let points=values.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' '),zeroY=y(0),last=values[values.length-1]||0,stroke=last>=0?'#21c697':'#ff8193';return `<div class="labelrow"><h3>Semesterbilanz · ${esc(sem.name)}</h3><b style="color:${stroke}">${signedTime(Math.round(last*60))}</b></div><p class="hint">Kumulierte Abweichung vom Tagesziel seit Semesterbeginn. Ein Tag mit 5h statt 3h ergibt +2h, ein Tag ohne Lernen bei 3h Ziel −3h.</p><svg class="balance-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Semesterbilanz ${last.toFixed(1)} Stunden"><line x1="${marg}" y1="${zeroY}" x2="${w-marg}" y2="${zeroY}" stroke="#8190ab" stroke-dasharray="6 6"/><text x="4" y="${zeroY-5}" fill="#aebbd0" font-size="16">0h</text>${[0,.25,.5,.75,1].map(f=>{let v=low+(high-low)*f;return `<line x1="${marg}" y1="${y(v)}" x2="${w-marg}" y2="${y(v)}" stroke="#30374a"/><text x="2" y="${y(v)-4}" fill="#9babbe" font-size="12">${v.toFixed(1)}h</text>`}).join('')}<polyline points="${points}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${series.slice(1).map((p,i)=>`<circle tabindex="0" cx="${x(i+1)}" cy="${y(p.balance/60)}" r="5" fill="${stroke}" aria-label="${esc(formatSemesterDate(p.day))}: ${signedTime(p.balance)}"><title>${formatSemesterDate(p.day)} · Gelernt ${fmtDuration(p.actual)} · Ziel ${fmtDuration(p.target)} · Tagesbilanz ${signedTime(p.actual-p.target)} · Gesamt ${signedTime(p.balance)}</title></circle>`).join('')}<circle cx="${x(values.length-1)}" cy="${y(last)}" r="5.5" fill="${stroke}"/><text x="${marg}" y="${h-8}" fill="# function insightsCard(){let sem=activeSemester(),all=dateSeries(sem.start,sem.end).filter(k=>k<=today()),active=all.filter(k=>dayM(k)>0).length,inactive=all.length-active,total=all.reduce((n,k)=>n+dayM(k),0),ratio=all.length?Math.round(active/all.length*100):0;return `<div class="insight-widget"><div class="goal-tabs">${[['insights','Insights'],['average','Durchschnitt']].map(([v,n])=>`<button class="${insightsTab===v?'active':''}" onclick="insightsTab='${v}';render()">${n}</button>`).join('')}</div>${insightsTab==='insights'?`<div class="insights-content"><div class="insights-ring" style="--pct:${ratio}%"><div>${ratio}%</div></div><div class="insights-data"><span>● Aktive Tage</span><strong>${active} / ${all.length} <small>(${ratio}%)</small></strong><span style="color:#c69bd9">● Inaktive Tage</span><strong>${inactive} / ${all.length} <small>(${100-ratio}%)</small></strong></div></div>`:`<div class="average-content"><div><strong>${fmtDuration(active?total/active:0)}</strong><span>Pro aktivem Tag</span></div><div><strong>${fmtDuration(all.length?total/all.length:0)}</strong><span>Über alle vergangenen Tage</span></div></div><p class="hint">Zeitraum: ${esc(sem.name)} · ${all.length} Tage bis heute</p>`}</div>`}
function subjectsChart(){let data=sums(),max=Math.max(60,...data.map(s=>s.total)),w=850,h=280,left=58,right=28,top=28,bottom=82,innerH=h-top-bottom,innerW=w-left-right,scale=v=>top+innerH-v/max*innerH,step=innerW/Math.max(1,data.length-1),points=data.map((s,i)=>[left+i*step,scale(s.total)]);let path=points.length?'M '+points.map(p=>p.join(' ')).join(' L '):'';return `<h3>Lernzeit nach Fach</h3><p class="hint">Insgesamt gelernte Stunden je Fach · Punkte verbinden die Fächer zur besseren Übersicht.</p><div class="subject-chart-wrap"><svg viewBox="0 0 ${w} ${h}" class="subject-chart" role="img" aria-label="Lernzeit je Fach"><line x1="${left}" y1="${top}" x2="${left}" y2="${h-bottom}" stroke="#4a5368"/>${[0,.25,.5,.75,1].map(f=>`<g><line x1="${left}" y1="${scale(max*f)}" x2="${w-right}" y2="${scale(max*f)}" stroke="#30374a"/><text x="${left-9}" y="${scale(max*f)+5}" text-anchor="end" fill="#92a1b8" font-size="14">${(max*f/60).toFixed(1)}h</text></g>`).join('')}<path d="${path}" fill="none" stroke="#4e9bff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${points.map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="6" fill="${esc(data[i].color)}" stroke="#111521" stroke-width="3"><title>${esc(data[i].name)}: ${fmtDuration(data[i].total)}</title></circle><text x="${x}" y="${h-bottom+25}" fill="#b2c1d4" text-anchor="middle" font-size="13">${esc(data[i].name.length>15?data[i].name.slice(0,14)+'…':data[i].name)}</text><text x="${x}" y="${y-12}" fill="#dce8fb" text-anchor="middle" font-size="13">${fmtDuration(data[i].total)}</text></g>`).join('')}</svg></div>`}
function goalsView(){return `<div class="layout-entry"><section class="card"><h2>Individuelle Tagesziele</h2><p class="hint">Lege für jeden Wochentag fest, wie viele Stunden du selbstständig lernen möchtest. Auch 0 Stunden für einen freien Tag sind möglich.</p><form onsubmit="saveDailyGoals(event)">${dayNames.map((n,i)=>`<div class="goal-input-row"><label for="day-goal-${i}">${n}</label><input id="day-goal-${i}" name="day${i}" type="number" min="0" max="24" step="0.25" value="${Number(state.dailyGoals[i])/60}" required><span class="hint">Stunden</span></div>`).join('')}<div class="field"><label for="goal-scope">Gültigkeit</label><select id="goal-scope" name="scope"><option value="future">Nur zukünftige Tage (ab morgen)</option><option value="all">Alle Lerntage (auch rückwirkend)</option></select></div><p class="hint">Ab morgen: Bisherige Ziele bleiben erhalten. Rückwirkend: Der neue Wochenplan gilt für alle vergangenen und zukünftigen Tage, einschließlich Tagen ohne Lernzeit; bestehende Zielversionen werden ersetzt. Lerneinheiten bleiben erhalten.</p><button class="btn white" style="width:100%;margin-top:15px">Tagesziele speichern</button></form></section><section class="card"><h2>Dein Wochenplan</h2><p>Geplantes Lernpensum: <strong>${fmtDuration(state.dailyGoals.reduce((a,b)=>a+Number(b),0))} pro Woche</strong></p><p class="hint">Die Tages-, Wochen- und Monatsansichten berechnen ihre Zielwerte aus diesen Vorgaben. Auch die Semesterbilanz berücksichtigt die einzelnen Wochentage.</p><div class="line"></div><h3>Zielhistorie</h3>${[...goalHistory()].reverse().map(e=>`<p class="hint">${e.from==='0001-01-01'?'Grundplan · alle Tage':'Ab '+formatSemesterDate(e.from)}: ${e.goals.map((m,i)=>dayNames[i].slice(0,2)+' '+fmtDuration(m)).join(' · ')}</p>`).join('')}<h3>Hinweise zur Bilanz</h3><p class="hint">Wenn du an einem Tag dein Ziel übertriffst, wird die zusätzliche Lernzeit gutgeschrieben. Bleibst du darunter, wird die Differenz abgezogen. Freie Tage mit einem Ziel von 0 Stunden erzeugen kein Minus.</p></section></div>`}
function saveDailyGoals(e){e.preventDefault();let f=new FormData(e.target),a=dayNames.map((_,i)=>Number(f.get('day'+i)));if(a.some(v=>!Number.isFinite(v)||v<0||v>24))return alert('Bitte zwischen 0 und 24 Stunden je Tag angeben.');applyGoalPlan(a.map(v=>Math.round(v*60)),f.get('scope')==='all'?'all':'future');persist();render()}

function dashboard(){let w=weekM(),done=days(7);return `<div class="dashboard-grid">
${card(`<h2>Kalender</h2>${miniCal()}`)}
${card(`<div class="labelrow"><h2>Dein Lernfortschritt</h2><button class="btn alt small" onclick="go('goals')">◎ Ziele</button></div>${targetCard()}`)}
${card(`<h2>Insights & Durchschnitt</h2>${insightsCard()}`)}
${card(monthlyLearning())}
${card(`<div class="labelrow"><h2>Wochenfortschritt</h2><b>${Math.round(w/Math.max(1,weekTarget())*100)}%</b></div><div class="progress"><div style="width:${Math.min(100,w/Math.max(1,weekTarget())*100)}%"></div></div><p class="hint">${minsFmt(w)} von ${fmtDuration(weekTarget())} Wochenziel</p><div class="line"></div>${subjectsChart()}`)}
${card(`<div class="labelrow"><h2>Fächer</h2><span class="chip">${state.subjects.length} Fächer</span></div><div class="stack">${sums().map(s=>`<span style="background:${s.color};width:${allM()?s.total/allM()*100:0}%"></span>`).join('')}</div>${subjectRows()}`)}
${card(`<h2>Aktivitäten</h2>${distribution()}`)}
${card(`<div class="labelrow"><h2>Lernzeit</h2><div class="tabs"><button class="${range==='week'?'active':''}" onclick="range='week';render()">Woche</button><button class="${range==='month'?'active':''}" onclick="range='month';render()">Monat</button></div></div>${bars()}`)}
${card(`<h2>Letzte Lerneinheiten</h2>${state.sessions.length?historyTable([...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4),false):'<div class="empty">Noch keine Einheiten erfasst.</div>'}<button class="btn alt small" style="margin-top:15px" onclick="go('sessions')">Alle Lerneinheiten ansehen</button>`)}
${card(`<h2>Die nächsten Prüfungen</h2>${[...state.exams].filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(e=>`<div class="subrow"><span class="dot" style="color:${getSub(e.subject).color}"></span><span>${esc(getSub(e.subject).name)}</span><strong>${Math.round((new Date(e.date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)} Tage</strong></div>`).join('')||'<div class="empty">Keine kommenden Prüfungen.</div>'}`)}
</div>`}
function historyTable(list,editable=true){return `<div class="tablebox"><table class="history"><thead><tr><th>Datum</th><th>Zeit</th><th>Dauer</th><th>Fach</th><th>Aktivität</th><th>Notiz</th>${editable?'<th>Aktion</th>':''}</tr></thead><tbody>${list.map(s=>{let date=new Date(s.date),end=s.end?new Date(s.end):new Date(date.getTime()+(minutes(s)+(Number(s.breakMinutes)||0))*60000);return `<tr><td>${date.toLocaleDateString('de-DE')}</td><td>${date.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} – ${end.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${minsFmt(minutes(s))}</b>${s.breakMinutes?`<div class="hint">Pause ${minsFmt(s.breakMinutes)}</div>`:''}</td><td><span class="dot" style="color:${getSub(s.subject).color}"></span> ${esc(getSub(s.subject).name)}</td><td>${esc(s.activity||'Lernen')}</td><td class="note" title="${esc(s.note||'')}">${esc(s.note||'–')}</td>${editable?`<td><button class="btn alt small" onclick="editSession('${esc(s.id)}')">Bearbeiten</button> <button class="btn red small" onclick="deleteSession('${esc(s.id)}')">×</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function sessionsView(){let list=[...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(s=>(!subjectFilter||s.subject===subjectFilter)&&(!search||[getSub(s.subject).name,s.activity,s.note,sessionDay(s)].join(' ').toLowerCase().includes(search.toLowerCase())));return `<div class="sessions-layout"><section class="card session-entry"><h2>Neue Lerneinheit</h2>${sessionForm()}<p class="hint">Nachträgliche Einträge und Pausen werden korrekt getrennt gespeichert.</p></section><section class="card"><div class="labelrow"><h2>Historie</h2><span class="chip">${list.length} Einheiten · ${minsFmt(list.reduce((n,s)=>n+minutes(s),0))}</span></div><div class="filterrow"><input placeholder="Suchen …" value="${esc(search)}" oninput="search=this.value;refreshHistory()" id="history-search"><select onchange="subjectFilter=this.value;refreshHistory()"><option value="">Alle Fächer</option>${state.subjects.map(s=>`<option value="${esc(s.id)}" ${subjectFilter===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div id="history-results">${list.length?historyTable(list):'<div class="empty">Keine passenden Einheiten.</div>'}</div></section></div>`}
function refreshHistory(){let list=[...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(s=>(!subjectFilter||s.subject===subjectFilter)&&(!search||[getSub(s.subject).name,s.activity,s.note,sessionDay(s)].join(' ').toLowerCase().includes(search.toLowerCase())));$('#history-results').innerHTML=list.length?historyTable(list):'<div class="empty">Keine passenden Einheiten.</div>'}
const activities=['Altklausur','GU','Auswendiglernen','Karteikarten','Vorlesung'];
function normalizeActivity(value){return ({'Aufgaben bearbeiten':'GU','Hörsaalübung':'GU','Auswendig lernen':'Auswendiglernen','Vorlesung nacharbeiten':'Vorlesung'})[value]||value}
function migrateActivities(){let changed=false;for(let session of state.sessions){let activity=normalizeActivity(session.activity);if(activity!==session.activity){session.activity=activity;changed=true}}return changed}
function selectSubs(selected=''){return state.subjects.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}

function sessionForm(s=null){let now=new Date(),start=s?new Date(s.date):new Date(now.getTime()-60*60000),end=s?.end?new Date(s.end):s?new Date(start.getTime()+(minutes(s)+(Number(s.breakMinutes)||0))*60000):now;return `<form class="session-form" oninput="updateSessionDuration(this)" onchange="updateSessionDuration(this)" onsubmit="submitSession(event,'${s?esc(s.id):''}')">
<div class="session-box session-date"><div><label for="session-day">Datum *</label><input id="session-day" type="date" name="day" required value="${localDay(start)}"></div><button type="button" class="date-step" aria-label="Vorheriger Tag" onclick="shiftSessionDay(this,-1)">‹</button><button type="button" class="date-step" aria-label="Nächster Tag" onclick="shiftSessionDay(this,1)">›</button></div>
<div class="session-times session-box"><div><label for="session-start">Start *</label><input id="session-start" name="start" type="time" required value="${pad(start.getHours())}:${pad(start.getMinutes())}"></div><div><label for="session-end">Ende *</label><input id="session-end" name="end" type="time" required value="${pad(end.getHours())}:${pad(end.getMinutes())}"></div><div><label for="session-break">Pause <span class="hint">Min.</span></label><input id="session-break" name="break" type="number" min="0" step="1" required value="${s?.breakMinutes||0}"></div></div>
<output class="session-duration" aria-live="polite">Dauer: ${fmtDuration(Math.round((end-start)/60000)-(s?.breakMinutes||0))}${localDay(end)!==localDay(start)?' · Ende am Folgetag':''}</output>
<div class="session-box"><label for="session-subject">Fach *</label><select id="session-subject" name="subject" required>${selectSubs(s?.subject||state.subjects[0]?.id)}</select></div>
<div class="session-box"><label for="session-activity">Aktivität</label><select id="session-activity" name="activity"><option value="">Keine Angabe</option>${s?.activity&&!activities.includes(s.activity)?`<option selected>${esc(s.activity)}</option>`:''}${activities.map(a=>`<option ${s?.activity===a?'selected':''}>${a}</option>`).join('')}</select></div>
<div class="session-box"><label for="session-note">Notiz</label><textarea id="session-note" name="note" rows="3" placeholder="Was hast du gelernt?">${esc(s?.note||'')}</textarea></div>
<button class="btn white" style="width:100%" type="submit">${s?'Änderungen speichern':'Anlegen'}</button></form>`}
function sessionTiming(f){let day=String(f.get('day')||''),a=String(f.get('start')||''),b=String(f.get('end')||''),pause=Number(f.get('break'));let start=new Date(day+'T'+a),end=new Date(day+'T'+b);if(end<start)end.setDate(end.getDate()+1);let span=(end-start)/60000;return {start,end,pause,span,valid:!!day&&!!a&&!!b&&Number.isFinite(span)&&span>0&&span<=1440&&Number.isInteger(pause)&&pause>=0&&pause<span}}
function shiftSessionDay(button,n){let form=button.form,input=form.elements.day;if(input.value)input.value=dateShift(input.value,n);updateSessionDuration(form)}
function updateSessionDuration(form){let t=sessionTiming(new FormData(form));form.querySelector('output').textContent=t.valid?'Dauer: '+fmtDuration(Math.round(t.span-t.pause))+(localDay(t.end)!==localDay(t.start)?' · Ende am Folgetag':''):'Dauer: –';}
function submitSession(event,id){event.preventDefault();let f=new FormData(event.target),{start,end,pause,span,valid}=sessionTiming(f);if(!valid)return alert('Bitte Start, Ende und eine kürzere Pause in ganzen Minuten angeben. Liegt das Ende vor dem Start, gilt es als Folgetag.');let obj={id:id||uid(),subject:f.get('subject'),date:start.toISOString(),end:end.toISOString(),minutes:Math.round(span-pause),breakMinutes:pause,activity:f.get('activity'),note:String(f.get('note')||'')};if(!state.subjects.some(s=>s.id===obj.subject))return alert('Bitte ein Fach wählen.');if(id){let i=state.sessions.findIndex(s=>s.id===id);if(i<0)return;state.sessions[i]=obj;closeDialog()}else state.sessions.push(obj);persist();render()}
function deleteSession(id){if(confirm('Diese Lerneinheit endgültig löschen?')){state.sessions=state.sessions.filter(s=>s.id!==id);persist();render()}}
function editSession(id){let s=state.sessions.find(s=>s.id===id);if(s)dialog(`<h2>Lerneinheit bearbeiten</h2>${sessionForm(s)}`)}

function dayDetails(k){let list=state.sessions.filter(s=>sessionDay(s)===k),target=dailyTarget(k),totals=new Map();for(let s of list)totals.set(s.subject,(totals.get(s.subject)||0)+minutes(s));return '<h3>'+esc(new Date(k+'T12:00:00').toLocaleDateString('de-DE',{dateStyle:'full'}))+'</h3><p>'+minsFmt(dayM(k))+' gelernt · Ziel '+fmtDuration(target)+' · Bilanz '+signedTime(dayM(k)-target)+'</p>'+ (list.length?[...totals].map(([subject,total])=>'<div class="subrow"><span class="dot" style="color:'+esc(getSub(subject).color)+'"></span><span>'+esc(getSub(subject).name)+'</span><strong>'+minsFmt(total)+'</strong></div>').join(''):'<p class="hint">Keine Lerneinheiten.</p>')}
function previewDay(k){let el=$('#calendar-day-details');if(el)el.innerHTML=dayDetails(k)}

function dayInfo(k){let list=state.sessions.filter(s=>sessionDay(s)===k);dialog(`<h2>${new Date(k+'T12:00:00').toLocaleDateString('de-DE',{dateStyle:'full'})}</h2><p>${minsFmt(dayM(k))} gelernt · ${list.length} Einheiten</p>${list.length?historyTable(list,false):'<p class="hint">Keine Einheiten.</p>'}`)}
function tasksView(){return `<div class="layout-entry"><section class="card"><h2>Neue Aufgabe</h2><form onsubmit="createTask(event)"><div class="field"><label>Aufgabe *</label><input name="title" maxlength="150" required placeholder="z. B. Baustatik GÜ 2"></div><div class="field"><label>Fach</label><select name="subject"><option value="">Ohne Fach</option>${selectSubs()}</select></div><div class="field"><label>Fällig am</label><input type="date" name="due"></div><div class="field"><label>Notiz</label><textarea name="note" rows="3"></textarea></div><button class="btn white" style="width:100%">Anlegen</button></form></section><section class="card"><div class="labelrow"><h2>Meine Aufgaben</h2><div class="tabs"><button class="${taskFilter==='all'?'active':''}" onclick="taskFilter='all';render()">Alle</button><button class="${taskFilter==='open'?'active':''}" onclick="taskFilter='open';render()">Offen</button><button class="${taskFilter==='done'?'active':''}" onclick="taskFilter='done';render()">Erledigt</button></div></div>${state.tasks.filter(t=>taskFilter==='all'||(taskFilter==='done'?t.done:!t.done)).map(t=>`<div class="subrow" style="grid-template-columns:30px 1fr auto"><input type="checkbox" style="width:18px" ${t.done?'checked':''} onchange="toggleTask('${esc(t.id)}')"><span style="${t.done?'text-decoration:line-through;color:#78859a':''}"><strong>${esc(t.title)}</strong><div class="hint">${t.subject?esc(getSub(t.subject).name)+' · ':''}${t.due?esc(t.due)+' · ':''}${esc(t.note||'')}</div></span><button class="btn red small" onclick="removeTask('${esc(t.id)}')">×</button></div>`).join('')||'<div class="empty">Noch keine passenden Aufgaben.</div>'}</section></div>`}
function createTask(e){e.preventDefault();let f=new FormData(e.target);state.tasks.push({id:uid(),title:String(f.get('title')).trim(),subject:f.get('subject'),due:f.get('due'),note:f.get('note'),done:false});persist();render()}
function toggleTask(id){let t=state.tasks.find(t=>t.id===id);if(t)t.done=!t.done;persist();render()}
function removeTask(id){if(confirm('Aufgabe löschen?')){state.tasks=state.tasks.filter(t=>t.id!==id);persist();render()}}

function semestersView(){let list=[...state.semesters].sort((a,b)=>b.start.localeCompare(a.start));return `<div class="layout-entry"><section class="card"><h2>Semester anlegen</h2><p class="hint">Lege Zeiträume für dein Studium fest. Deine bisherigen Lernzeiten bleiben unabhängig davon erhalten.</p><form onsubmit="saveSemester(event)"><div class="field"><label>Semestername *</label><input name="name" maxlength="100" required placeholder="z. B. Wintersemester 2026/27"></div><div class="two"><div class="field"><label>Beginn *</label><input name="start" type="date" required value="2026-09-05"></div><div class="field"><label>Ende *</label><input name="end" type="date" required value="2027-03-31"></div></div><button class="btn white" style="width:100%">Semester anlegen</button></form></section><section class="card"><h2>Meine Semester</h2>${list.map(x=>`<div class="semester-entry"><div><strong>${esc(x.name)}</strong><div class="hint">${formatSemesterDate(x.start)} – ${formatSemesterDate(x.end)}</div></div><div class="flex"><button class="btn alt small" onclick="editSemester('${esc(x.id)}')">Bearbeiten</button><button class="btn red small" onclick="deleteSemester('${esc(x.id)}')">Löschen</button></div></div>`).join('')||'<div class="empty">Noch kein Semester angelegt.</div>'}</section></div>`}
function formatSemesterDate(v){return new Date(v+'T12:00:00').toLocaleDateString('de-DE')}
function saveSemester(e,id=''){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),start=String(f.get('start')||''),end=String(f.get('end')||'');if(!name||!/^\d{4}-\d{2}-\d{2}$/.test(start)||!/^\d{4}-\d{2}-\d{2}$/.test(end)||end<start)return alert('Bitte einen Namen und einen gültigen Zeitraum angeben.');let obj={id:id||uid(),name,start,end};if(id){let i=state.semesters.findIndex(x=>x.id===id);if(i<0)return;state.semesters[i]=obj;closeDialog()}else state.semesters.push(obj);persist();render()}
function editSemester(id){let x=state.semesters.find(a=>a.id===id);if(!x)return;dialog(`<h2>Semester bearbeiten</h2><form onsubmit="saveSemester(event,'${esc(x.id)}')"><div class="field"><label>Semestername *</label><input name="name" maxlength="100" required value="${esc(x.name)}"></div><div class="two"><div class="field"><label>Beginn *</label><input name="start" type="date" required value="${esc(x.start)}"></div><div class="field"><label>Ende *</label><input name="end" type="date" required value="${esc(x.end)}"></div></div><button class="btn white" style="width:100%">Änderungen speichern</button></form>`)}
function deleteSemester(id){if(confirm('Dieses Semester löschen? Lernzeiten bleiben erhalten.')){state.semesters=state.semesters.filter(x=>x.id!==id);persist();render()}}

function settingsView(){return `${card(`<h2>Wochenziel & Fächer</h2><div class="field" style="max-width:260px"><label>Wochenziel in Stunden</label><input type="number" min="1" max="100" id="goal-input" value="${state.weeklyGoal}"></div><button class="btn" onclick="saveGoal()">Ziel ab morgen speichern</button><p class="hint">Verteilt das Wochenziel entsprechend deinem Tagesplan. Weitere Gültigkeitsbereiche findest du unter Ziele.</p><div class="line"></div><h3>Fächer verwalten</h3>${state.subjects.map(s=>`<div class="subrow"><span class="dot" style="color:${s.color}"></span><span>${esc(s.name)}</span><button class="btn red small" onclick="removeSubject('${esc(s.id)}')">Entfernen</button></div>`).join('')}<form onsubmit="addSubject(event)" class="flex" style="margin-top:15px"><input name="name" style="flex:1;min-width:160px" required maxlength="70" placeholder="Neues Fach"><input type="color" name="color" value="#3488ff" style="width:55px;height:44px;padding:5px"><button class="btn">Hinzufügen</button></form>`)}<div style="height:16px"></div>${card(`<h2>Datensicherung</h2><p class="hint">Deine Daten werden ausschließlich in diesem Browser auf diesem Gerät gespeichert. Bei Browserwechsel oder gelöschten Websitedaten können sie verloren gehen. Exportiere regelmäßig deine Daten.</p><div class="flex"><button class="btn" onclick="exportData()">↓ JSON-Backup herunterladen</button><label class="btn alt filebtn">↑ Backup importieren<input type="file" accept=".json,application/json" onchange="importData(event)"></label><button class="btn red" onclick="resetAll()">Alles zurücksetzen</button></div><p class="notice">Beim Hochladen einer neuen index.html auf GitHub werden bestehende Lernzeiten normalerweise nicht gelöscht, sofern du denselben Browser und dieselbe Website-Adresse verwendest. Erstelle trotzdem vorher ein Backup.</p>`)}`}
function saveGoal(){let n=Number($('#goal-input').value);if(!Number.isInteger(n)||n<1||n>100)return alert('Bitte 1–100 Stunden eingeben.');let total=weekTarget()||7;applyGoalPlan(state.dailyGoals.map(v=>Math.round((total===7?1:v)/total*n*60)),'future');persist();render()}
function addSubject(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;state.subjects.push({id:uid(),name,color:f.get('color')});persist();render()}
function removeSubject(id){if(state.subjects.length<=1)return alert('Es muss mindestens ein Fach bleiben.');if(state.sessions.some(s=>s.subject===id)||state.exams.some(e=>e.subject===id))return alert('Dieses Fach ist noch bei Lerneinheiten oder Prüfungen hinterlegt und kann deshalb nicht gelöscht werden.');if(confirm('Fach löschen?')){state.subjects=state.subjects.filter(s=>s.id!==id);persist();render()}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lernflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){let file=e.target.files[0];if(!file)return;file.text().then(x=>{try{let d=JSON.parse(x);if(!Array.isArray(d.subjects)||!Array.isArray(d.sessions)||!Array.isArray(d.exams))throw Error();if(!confirm('Achtung: Die bestehenden Daten mit diesem Backup überschreiben?'))return;state={...defaults(),...d,tasks:Array.isArray(d.tasks)?d.tasks:[],semesters:Array.isArray(d.semesters)?d.semesters:[],dailyGoals:Array.isArray(d.dailyGoals)&&d.dailyGoals.length===7?d.dailyGoals:[180,180,180,180,180,180,120]};persist();render();alert('Backup importiert.')}catch{alert('Ungültige Backup-Datei.')}})}
function resetAll(){if(confirm('Wirklich alle Lernzeiten, Fächer und Aufgaben löschen?')){state=defaults();persist();render()}}
function dialog(html){let cover=document.createElement('div');cover.id='dialog';cover.style='position:fixed;inset:0;z-index:70;background:#02040ad9;display:grid;place-items:center;padding:12px';cover.innerHTML=`<div class="card" style="width:min(620px,100%);max-height:92vh;overflow:auto"><div class="labelrow" style="margin-bottom:20px"><strong>Lernflow</strong><button class="btn alt small" onclick="closeDialog()">✕ Schließen</button></div>${html}</div>`;cover.addEventListener('click',e=>{if(e.target===cover)closeDialog()});document.body.appendChild(cover)}
function closeDialog(){$('#dialog')?.remove()}
function newAction(){go('sessions');window.scrollTo(0,0)}
// Timer state is stored separately and uses wall-clock timestamps so a page refresh won't lose running time.
let timer;try{timer={mode:'stopwatch',subject:state.subjects[0]?.id||'',activity:'GU',phase:'idle',focusMs:0,breakMs:0,phaseStarted:0,sessionStarted:0,pomodoroMinutes:25,...JSON.parse(localStorage.getItem(TIMER_KEY)||'{}')}}catch{timer={mode:'stopwatch',subject:state.subjects[0]?.id||'',activity:'GU',phase:'idle',focusMs:0,breakMs:0,phaseStarted:0,sessionStarted:0,pomodoroMinutes:25}}
timer.activity=normalizeActivity(timer.activity);
function saveTimerState(){try{localStorage.setItem(TIMER_KEY,JSON.stringify(timer))}catch{}}
function focusMs(){return timer.focusMs+(timer.phase==='focus'?Math.max(0,Date.now()-timer.phaseStarted):0)}
function breakMs(){return timer.breakMs+(timer.phase==='break'?Math.max(0,Date.now()-timer.phaseStarted):0)}
function timerDisplay(){let n=timer.mode==='pomodoro'?Math.max(0,timer.pomodoroMinutes*60000-focusMs()):focusMs();return clockFmt(Math.floor(n/1000))}
function timerStatus(){return ({idle:'Bereit zum Lernen',focus:'Lernzeit läuft',break:'Pause läuft – zählt nicht als Lernzeit',paused:'Timer pausiert'})[timer.phase]}
function changeTimerMode(v){if(timer.phase!=='idle'&&(focusMs()||breakMs()))return alert('Bitte zuerst die laufende Einheit speichern oder verwerfen.');timer.mode=v;saveTimerState();renderMenu();renderFullTimer()}
function chooseTimerSubject(v){if(timer.phase!=='idle'&&focusMs()>0)return alert('Fachwechsel ist während einer begonnenen Einheit nicht möglich. Speichere zuerst.');timer.subject=v;saveTimerState();renderMenu();renderFullTimer()}
function focusStart(){if(!state.subjects.some(s=>s.id===timer.subject))timer.subject=state.subjects[0]?.id||'';if(!timer.sessionStarted)timer.sessionStarted=Date.now();if(timer.phase==='focus')return;if(timer.phase==='break')timer.breakMs=breakMs();timer.phase='focus';timer.phaseStarted=Date.now();saveTimerState();renderMenu();renderFullTimer()}
function pauseStart(){if(timer.phase!=='focus')return;if(timer.phase==='focus')timer.focusMs=focusMs();timer.phase='break';timer.phaseStarted=Date.now();saveTimerState();renderMenu();renderFullTimer()}
function pauseAll(){if(timer.phase==='focus')timer.focusMs=focusMs();if(timer.phase==='break')timer.breakMs=breakMs();timer.phase='paused';timer.phaseStarted=0;saveTimerState();renderMenu();renderFullTimer()}
function discardTimer(){if((focusMs()||breakMs())&&!confirm('Timer ohne Speichern verwerfen?'))return;timer.phase='idle';timer.focusMs=0;timer.breakMs=0;timer.phaseStarted=0;timer.sessionStarted=0;saveTimerState();renderMenu();renderFullTimer()}
function finishTimer(){let f=focusMs(),b=breakMs();if(f<30000)return alert('Mindestens 30 Sekunden aktive Lernzeit sind zum Speichern erforderlich.');if(timer.phase==='focus')timer.focusMs=focusMs();if(timer.phase==='break')timer.breakMs=breakMs();timer.phase='paused';timer.phaseStarted=0;saveTimerState();pendingTimerSession={subject:timer.subject,start:new Date(timer.sessionStarted||Date.now()-f-b),end:new Date(),breakMinutes:Math.round(b/60000)};closeFullscreen();$('#timer-menu').hidden=true;timerSaveDialog()}

function timerSaveDialog(){if(!pendingTimerSession)return;let x=pendingTimerSession;dialog(`<div class="labelrow"><h2>Lerneinheit anlegen</h2><button class="btn red small" onclick="cancelPendingTimer()">Timer abbrechen</button></div><form onsubmit="confirmTimerSession(event)"><div class="field"><label>Datum *</label><input type="date" name="day" required value="${localDay(x.start)}"></div><div class="two"><div class="field"><label>Start *</label><input type="time" name="start" required value="${pad(x.start.getHours())}:${pad(x.start.getMinutes())}"></div><div class="field"><label>Ende *</label><input type="time" name="end" required value="${pad(x.end.getHours())}:${pad(x.end.getMinutes())}"></div></div><div class="field"><label>Pause (Minuten)</label><input type="number" name="break" required min="0" step="1" value="${x.breakMinutes}"></div><div class="two"><div class="field"><label>Fach *</label><select name="subject" required>${selectSubs(x.subject)}</select></div><div class="field"><label>Aktivität</label><select name="activity"><option value="">Keine Angabe</option>${activities.map(a=>`<option>${esc(a)}</option>`).join('')}</select></div></div><div class="field"><label>Notiz</label><textarea name="note" rows="3" placeholder="Was hast du gelernt?"></textarea></div><div class="flex" style="justify-content:space-between"><button class="btn alt" type="button" onclick="closeDialog();pendingTimerSession=null">Später speichern</button><button class="btn white" type="submit">Lerneinheit anlegen</button></div></form>`);let el=$('#dialog')?.firstElementChild;if(el)el.className='save-session-dialog'}
function cancelPendingTimer(){if(!confirm('Timer ohne Speichern abbrechen?'))return;pendingTimerSession=null;closeDialog();discardTimer()}
function confirmTimerSession(e){e.preventDefault();let f=new FormData(e.target),day=String(f.get('day')),start=new Date(day+'T'+f.get('start')),end=new Date(day+'T'+f.get('end')),pause=Number(f.get('break'));if(end<=start)end.setDate(end.getDate()+1);let span=(end-start)/60000;if(!Number.isFinite(span)||span<=0||span>1440||!Number.isInteger(pause)||pause<0||pause>=span)return alert('Bitte gültige Uhrzeiten und eine Pause kleiner als die Dauer angeben.');let subject=String(f.get('subject'));if(!state.subjects.some(s=>s.id===subject))return alert('Bitte ein gültiges Fach wählen.');state.sessions.push({id:uid(),subject,date:start.toISOString(),end:end.toISOString(),minutes:Math.round(span-pause),breakMinutes:pause,activity:String(f.get('activity')||''),note:String(f.get('note')||'')});persist();pendingTimerSession=null;timer.phase='idle';timer.focusMs=0;timer.breakMs=0;timer.phaseStarted=0;timer.sessionStarted=0;saveTimerState();closeDialog();render()}

function toggleMenu(){let el=$('#timer-menu');if(!el.hidden){el.hidden=true;return}renderMenu();el.hidden=false}
function renderMenu(){let el=$('#timer-menu');
el.innerHTML=`<div class="labelrow"><h2>◉ Timer</h2><button class="btn alt small" onclick="$('#timer-menu').hidden=true">✕</button></div>
<div class="timer-tabs"><button class="${timer.mode==='stopwatch'?'active':''}" onclick="changeTimerMode('stopwatch')">Stoppuhr</button><button class="${timer.mode==='pomodoro'?'active':''}" onclick="changeTimerMode('pomodoro')">Pomodoro</button><label><input type="checkbox" ${timerAutoFocus?'checked':''} onchange="setAutoFocus(this.checked)"> Vollbild</label></div>
<div class="timer-subjects">${state.subjects.map(s=>`<button class="timer-subject" onclick="startSubjectTimer('${esc(s.id)}')"><span class="subject-dot" style="--subject-color:${esc(s.color)}"></span><span>${esc(s.name)}</span><span class="subject-play">▶</span></button>`).join('')}</div>
${timer.phase!=='idle'?`<div class="timer-active"><div class="hint">${esc(getSub(timer.subject).name)} · ${timerStatus()}</div><div class="timerClock" id="menu-clock">${timerDisplay()}</div><div class="flex" style="justify-content:center"><button class="btn small" onclick="${timer.phase==='focus'?'pauseStart()':'focusStart()'}">${timer.phase==='focus'?'⏸ Pause':'▶ Fortsetzen'}</button><button class="btn alt small" onclick="openFullscreen()">⛶ Fokus</button><button class="btn white small" onclick="finishTimer()">✓ Speichern</button></div></div>`:''}`}
function setAutoFocus(v){timerAutoFocus=!!v;localStorage.setItem('lernflow-auto-focus',String(timerAutoFocus));renderMenu()}
function startSubjectTimer(id){if(timer.phase!=='idle'&&timer.subject!==id&&(focusMs()>0||breakMs()>0)){alert('Bitte zuerst die laufende Lerneinheit speichern oder verwerfen.');return}timer.subject=id;saveTimerState();focusStart();if(timerAutoFocus)openFullscreen();else renderMenu()}
function openFullscreen(){$('#timer-menu').hidden=true;$('#full-timer').hidden=false;document.body.classList.add('focus-open');renderFullTimer()}
function closeFullscreen(){$('#full-timer').hidden=true;document.body.classList.remove('focus-open')}
function renderFullTimer(){let el=$('#full-timer');if(el.hidden)return;let subject=getSub(timer.subject),start=timer.sessionStarted?new Date(timer.sessionStarted).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–';
el.innerHTML=`<div class="focus-landscape" aria-hidden="true"></div><div class="focus-overlay" aria-hidden="true"></div><div class="focusPanel"><div class="focus-brand">✦ Lernflow</div>
<div class="focus-corner left">◷ Heute<strong>${minsFmt(dayM(today()))}</strong><div style="margin-top:12px">◎ Tagesziel<strong>${Math.min(100,Math.round(dayM(today())/Math.max(1,dailyTarget(today()))*100))}%</strong></div></div>
<div class="focus-corner right">Nächste Prüfung<strong>${nextExamLabel()}</strong><div style="margin-top:12px">Diese Woche<strong>${minsFmt(weekM())} / ${state.weeklyGoal}h</strong></div></div>
<div class="focus-subject"><span class="focus-subject-dot" style="--subject-color:${esc(subject.color||'#55ddb0')}"></span>${esc(subject.name)}</div>
<div class="focus-time" id="big-clock">${timerDisplay()}</div><div class="focus-start">Start: ${start}</div>
<div class="focus-stats"><span id="big-focus">Lernzeit ${clockFmt(Math.floor(focusMs()/1000))}</span><span id="big-break">Pause ${clockFmt(Math.floor(breakMs()/1000))}</span></div>
<div class="focus-actions"><button onclick="${timer.phase==='focus'?'pauseStart()':'focusStart()'}">${timer.phase==='focus'?'Ⅱ Pausieren':'▶ Fortsetzen'}</button><button class="primary" onclick="finishTimer()">✓ Lerneinheit speichern</button></div>
<div class="focus-bottom"><button onclick="closeFullscreen()" title="Fokusmodus schließen">✕</button><button onclick="discardTimer();closeFullscreen()" title="Timer verwerfen">↺</button></div></div>`}
function nextExamLabel(){let e=[...state.exams].filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];if(!e)return 'Keine bevorstehend';let n=Math.round((new Date(e.date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);return esc(getSub(e.subject).name)+' · '+n+' Tage'}
function renderLive(){let a=$('#menu-clock');if(a)a.textContent=timerDisplay();let b=$('#menu-break');if(b)b.textContent=clockFmt(Math.floor(breakMs()/1000));let c=$('#menu-status');if(c)c.textContent=timerStatus();let d=$('#big-clock');if(d)d.textContent=timerDisplay();let e=$('#big-focus');if(e)e.textContent='Lernzeit '+clockFmt(Math.floor(focusMs()/1000));let f=$('#big-break');if(f)f.textContent='Pause '+clockFmt(Math.floor(breakMs()/1000));$('#header-timer').textContent=timer.phase==='idle'?'▶ Timer ▾':`● ${timerDisplay()} ▾`}
let pomodoroNotified=false,lastRenderedDay=today();setInterval(()=>{if(today()!==lastRenderedDay){lastRenderedDay=today();render()}renderLive();if(timer.mode==='pomodoro'&&timer.phase==='focus'&&focusMs()>=timer.pomodoroMinutes*60000&&!pomodoroNotified){pomodoroNotified=true;pauseStart();alert('Pomodoro abgeschlossen! Deine Pause wurde gestartet.')}if(timer.phase==='idle')pomodoroNotified=false},1000);
window.addEventListener('beforeunload',()=>saveTimerState());
if(migrateActivities())persist();
render();
</script></body></html>
