<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101320"><title>Lernflow — Dein Lerncockpit</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef0fa;background:#0d101b;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}input,select,textarea{color:#eaf0fc;background:#151a2a;border:1px solid #353c52;border-radius:11px;padding:11px 13px;outline:none;width:100%}input:focus,select:focus,textarea:focus{border-color:#a7a2ff}option{background:#1d2133}button{border:0}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid #262b3c;background:#101421;padding:26px 16px;display:flex;flex-direction:column;gap:26px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;padding-left:15px}.brand span{color:#a19af8}.tag{color:#8490ad;font-size:10px;letter-spacing:1.7px;text-transform:uppercase;margin:0 12px 8px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{display:flex;align-items:center;gap:13px;text-align:left;background:transparent;color:#9ba5bb;border-radius:12px;padding:13px 15px;width:100%;font-weight:600}.nav button.active,.nav button:hover{background:#25283f;color:#e9e8ff}.nav button.active{box-shadow:inset 3px 0 #9990ff}.nav-icon{font-size:19px;width:22px;text-align:center}.sidebar-bottom{margin-top:auto;border-radius:16px;background:#1d2235;padding:15px;color:#aab2cd;font-size:12px;line-height:1.6}.sidebar-bottom strong{display:block;color:white;font-size:14px;margin-bottom:6px}main{padding:36px clamp(20px,4vw,60px);max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:15px}.muted{color:#96a0bb}.eyebrow{font-size:12px;color:#a5a0ff;font-weight:750;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:34px;letter-spacing:-1.3px;margin:7px 0}h2{font-size:18px;margin:0 0 17px;letter-spacing:-.35px}h3{margin:0 0 7px;font-size:15px}p{line-height:1.55}.btn{background:#8d83fa;color:#131323;padding:11px 17px;border-radius:11px;font-weight:800;white-space:nowrap}.btn:hover{background:#b1aaff}.btn.secondary{background:#252b41;color:#e7e7fb}.btn.danger{background:#51283d;color:#ffb4ba}.btn.small{padding:7px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:20px}.card{background:#171c2c;border:1px solid #2a3044;border-radius:18px;padding:22px;box-shadow:0 4px 30px #00000012}.kpi{font-size:28px;font-weight:800;letter-spacing:-1px;margin:12px 0 3px}.smalltext{color:#98a2ba;font-size:12px}.kpi-icon{font-size:24px}.layout2{display:grid;grid-template-columns:1.65fr 1fr;gap:20px}.section{margin-bottom:20px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.progress{height:8px;background:#2d3348;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#867fff,#c094f7);border-radius:20px;transition:width .2s}.chart{display:flex;align-items:end;gap:10px;height:175px;margin-top:25px}.chart-col{flex:1;display:flex;align-items:center;flex-direction:column;justify-content:end;gap:9px;height:100%}.chart-bar{width:min(100%,49px);border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#a09aff,#625cc0);min-height:3px;position:relative}.chart-bar:hover:after{content:attr(data-label);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#383d59;color:white;padding:4px 8px;border-radius:6px;white-space:nowrap;font-size:11px}.chart-col span{font-size:11px;color:#8d98b2}.subject{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #292f42}.subject:last-child{border-bottom:0}.dot{height:12px;width:12px;border-radius:4px;flex-shrink:0}.subject-name{font-weight:700;flex:1}.subject-time{font-size:12px;color:#a0aac6}.session{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #292f42}.session:last-child{border-bottom:0}.pill{font-size:11px;color:#b5b0ff;background:#2b2949;padding:6px 9px;border-radius:8px}.remove{background:transparent;color:#9aa4bf;font-size:19px;padding:4px}.remove:hover{color:#ff949e}.timerWrap{max-width:700px;margin:30px auto;text-align:center}.timerClock{font-size:clamp(68px,10vw,125px);font-variant-numeric:tabular-nums;letter-spacing:-5px;font-weight:750;margin:30px 0 10px}.timerRing{border:9px solid #393654;border-top-color:#a29bff;border-radius:50%;width:300px;height:300px;display:flex;align-items:center;justify-content:center;margin:32px auto;box-shadow:0 0 65px #8f80fa17}.timerRing .timerClock{font-size:68px;letter-spacing:-4px}.timerControls{justify-content:center;gap:13px}.timerControls button{min-width:125px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}label{display:block;color:#aeb8cd;font-size:12px;font-weight:700;margin-bottom:6px}.field{margin-bottom:15px}.grid-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{border:1px solid #343a50;background:#1b2032;border-radius:10px;min-height:78px;text-align:left;padding:9px;display:flex;flex-direction:column;gap:10px;color:#dbe1f2}.day:hover{border-color:#9993f6}.day.today{border-color:#b4aaff}.day b{font-size:12px}.day .mini{height:5px;background:#827df4;border-radius:5px}.weekday{font-size:11px;text-align:center;padding:10px 0;color:#aab4c8}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{text-align:left;font-size:12px;color:#9da8c3;font-weight:600}.table th,.table td{padding:15px;border-bottom:1px solid #2b3144}.exam{display:flex;align-items:center;gap:14px;border-bottom:1px solid #2a3044;padding:15px 0}.exam strong{font-size:16px}.countdown{margin-left:auto;color:#ada7ff;font-weight:800;text-align:right}.badge{background:#252b43;border-radius:8px;padding:6px 9px;font-size:11px;color:#c6cce3}.empty{color:#929bb4;text-align:center;padding:25px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#05070dcc;display:flex;justify-content:center;align-items:center;padding:20px;z-index:30}.modal{width:min(510px,100%);max-height:90vh;overflow:auto;background:#1b2133;border:1px solid #41465e;border-radius:19px;padding:27px;box-shadow:0 15px 100px #0008}.notice{padding:11px 14px;border-radius:10px;background:#292845;color:#c7c4ff;font-size:12px}.filebutton{display:inline-block;cursor:pointer}.filebutton input{display:none}.heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.heatcell{aspect-ratio:1;border-radius:4px;background:#2c3348}.heatcell.level1{background:#514c88}.heatcell.level2{background:#7068bf}.heatcell.level3{background:#aaa2ff}.footer{font-size:12px;color:#8491ac;margin-top:32px}@media(max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}}@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;gap:8px;border-right:0;border-bottom:1px solid #272d40}.brand{padding-left:6px;font-size:19px}.nav{flex-direction:row;overflow:auto}.nav button{padding:9px;width:auto;white-space:nowrap;font-size:12px}.nav-icon{display:none}.sidebar .tag,.sidebar-bottom{display:none}main{padding:25px 16px}.top{align-items:flex-start}h1{font-size:27px}.cards{gap:10px}.card{padding:15px}.kpi{font-size:22px}.formgrid{grid-template-columns:1fr}.grid-days{gap:3px}.day{padding:5px;min-height:62px}.timerRing{width:250px;height:250px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">✦ Lern<span>flow</span></div><div><p class="tag">DEIN WORKSPACE</p><nav class="nav" id="nav"></nav></div><div class="sidebar-bottom"><strong>🎯 Dein Lernziel</strong><span id="sidebar-goal"></span><div class="progress"><div class="bar" id="side-bar"></div></div><span id="sidebar-progress"></span></div></aside><main><header class="top"><div><div class="eyebrow" id="eyebrow">DEIN LERNCOCKPIT</div><h1 id="title">Dashboard</h1><div class="muted" id="subtitle">Behalte deine Lernzeit im Blick.</div></div><div class="flex"><button class="btn secondary" onclick="openModal('session')">+ Lerneinheit</button><button class="btn" onclick="switchTab('timer')">▶ Fokus starten</button></div></header><div id="content"></div><div class="footer">Lernflow · Eigenständiges Open-Source-Lerncockpit · Daten bleiben lokal in deinem Browser · Keine Verbindung zu Athenify</div></main></div><div id="modal-root"></div>
<script>
'use strict';
const KEY='lernflow-local-v1';
const initialSubjects=[['Baustatik I','#9d8cf9'],['BPM','#52c5af'],['Siedlung','#f2bc72'],['Hydrologie','#64aaf0'],['Geotechnik I','#ea839f']];
const defaultState=()=>({subjects:initialSubjects.map(([name,color],i)=>({id:'s'+i,name,color})),sessions:[],exams:[['s0','2027-02-09'],['s1','2027-02-11'],['s2','2027-02-25'],['s3','2027-02-26'],['s4','2027-03-18']].map(([subject,date])=>({id:crypto.randomUUID(),subject,date})),weeklyGoal:20,settings:{theme:'dark'}});
let state;try{const saved=JSON.parse(localStorage.getItem(KEY));state=saved&&Array.isArray(saved.sessions)&&Array.isArray(saved.subjects)?{...defaultState(),...saved}:defaultState()}catch{state=defaultState()}
let tab='dashboard',monthShift=0,timer={mode:'stopwatch',subject:state.subjects[0]?.id||'',activity:'Aufgaben bearbeiten',seconds:0,baseSeconds:0,startAt:0,running:false,startedAt:null,pomodoro:25*60};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function persist(){localStorage.setItem(KEY,JSON.stringify(state));updateSidebar()}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const duration=m=>`${Math.floor(m/60)} h ${Math.round(m%60)} min`;
const dateKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const monday=d=>{let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const dayMinutes=d=>state.sessions.filter(s=>s.date.slice(0,10)===d).reduce((a,s)=>a+Number(s.minutes),0);
const weekSessions=()=>{let start=monday(new Date());let end=new Date(start);end.setDate(end.getDate()+7);return state.sessions.filter(s=>{let d=new Date(s.date);return d>=start&&d<end})};
const weekMinutes=()=>weekSessions().reduce((a,s)=>a+Number(s.minutes),0);
const subjectById=id=>state.subjects.find(s=>s.id===id)||{name:'Gelöschtes Fach',color:'#a2a9b8'};
function updateSidebar(){let mins=weekMinutes(),goal=Math.max(1,Number(state.weeklyGoal));$('#sidebar-goal').textContent=`${goal} Stunden pro Woche`;$('#sidebar-progress').textContent=`${duration(mins)} / ${goal} h`;$('#side-bar').style.width=Math.min(100,mins/(goal*60)*100)+'%'}
const navItems=[['dashboard','◫','Dashboard'],['timer','◷','Fokus-Timer'],['sessions','▤','Lerneinheiten'],['calendar','▦','Kalender'],['subjects','◈','Fächer'],['exams','⚑','Prüfungen'],['analytics','▥','Statistiken'],['settings','⚙','Einstellungen']];
function switchTab(t){tab=t;render();window.scrollTo(0,0)}
function render(){ $('#nav').innerHTML=navItems.map(([id,ico,name])=>`<button class="${id===tab?'active':''}" onclick="switchTab('${id}')"><span class="nav-icon">${ico}</span>${name}</button>`).join('');const titles={dashboard:['Dashboard','Dein Fortschritt auf einen Blick.'],timer:['Fokus-Timer','Konzentriert lernen und jede Minute erfassen.'],sessions:['Lerneinheiten','Deine Lernzeit, vollständig dokumentiert.'],calendar:['Lernkalender','Wann hast du wie lange gelernt?'],subjects:['Meine Fächer','Deine Lernziele nach Fach.'],exams:['Prüfungen','Alle Deadlines im Blick.'],analytics:['Statistiken','Lerne deine Lerngewohnheiten kennen.'],settings:['Einstellungen','Passe Lernflow an deine Ziele an.']};$('#title').textContent=titles[tab][0];$('#subtitle').textContent=titles[tab][1];$('#eyebrow').textContent='LERNFLOW / '+tab.toUpperCase();$('#content').innerHTML=views[tab]();updateSidebar();if(tab==='timer')renderTimerLive()}
const card=(body,extra='')=>`<div class="card ${extra}">${body}</div>`;
function lastDays(n){let a=[];for(let i=n-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);a.push(dateKey(d))}return a}
function barChart(days){let vals=days.map(dayMinutes),max=Math.max(60,...vals);return `<div class="chart">${days.map((d,i)=>`<div class="chart-col"><div class="chart-bar" data-label="${duration(vals[i])}" style="height:${Math.max(3,vals[i]/max*135)}px"></div><span>${new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short'})}</span></div>`).join('')}</div>`}
function subjectRows(){let sums=new Map();for(let s of state.sessions)sums.set(s.subject,(sums.get(s.subject)||0)+Number(s.minutes));return state.subjects.length?state.subjects.map(s=>`<div class="subject"><div class="dot" style="background:${s.color}"></div><div class="subject-name">${escapeHTML(s.name)}</div><div class="subject-time">${duration(sums.get(s.id)||0)}</div></div>`).join(''):'<div class="empty">Noch keine Fächer vorhanden.</div>'}
function sessionRows(limit=Infinity){let sessions=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit);return sessions.length?sessions.map(s=>`<div class="session"><div class="dot" style="background:${subjectById(s.subject).color}"></div><div><strong>${escapeHTML(subjectById(s.subject).name)}</strong><div class="smalltext">${new Date(s.date).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'})} · ${escapeHTML(s.activity||'Lernen')}</div>${s.note?`<div class="smalltext">${escapeHTML(s.note)}</div>`:''}</div><span class="pill">${duration(s.minutes)}</span><button class="remove" title="Löschen" onclick="removeSession('${s.id}')">×</button></div>`).join(''):'<div class="empty">Noch keine Lerneinheiten. Starte den Timer oder füge eine Einheit hinzu.</div>'}
const views={
dashboard(){let mins=weekMinutes(),goal=state.weeklyGoal*60,days=lastDays(7),streak=0,d=new Date();if(!dayMinutes(dateKey(d)))d.setDate(d.getDate()-1);while(dayMinutes(dateKey(d))>0){streak++;d.setDate(d.getDate()-1)}let total=state.sessions.reduce((a,s)=>a+Number(s.minutes),0);let upcoming=state.exams.filter(e=>e.date>=dateKey(new Date())).sort((a,b)=>a.date.localeCompare(b.date))[0];return `<div class="cards">${card(`<div class="kpi-icon">◷</div><div class="kpi">${duration(mins)}</div><div class="smalltext">Gelernt diese Woche</div>`)}${card(`<div class="kpi-icon">◎</div><div class="kpi">${Math.round(mins/Math.max(1,goal)*100)}%</div><div class="smalltext">Wochenziel erreicht</div>`)}${card(`<div class="kpi-icon">🔥</div><div class="kpi">${streak} Tage</div><div class="smalltext">Aktuelle Lernserie</div>`)}${card(`<div class="kpi-icon">✦</div><div class="kpi">${duration(total)}</div><div class="smalltext">Insgesamt gelernt</div>`)}</div><div class="layout2"><div>${card(`<div class="flex between"><h2>Deine Lernwoche</h2><span class="badge">Letzte 7 Tage</span></div>${barChart(days)}<div class="progress"><div class="bar" style="width:${Math.min(100,mins/Math.max(1,goal)*100)}%"></div></div><div class="smalltext">${duration(mins)} von ${state.weeklyGoal} h Wochenziel</div>`,'section')}${card(`<div class="flex between"><h2>Letzte Lerneinheiten</h2><button class="btn secondary small" onclick="switchTab('sessions')">Alle ansehen</button></div>${sessionRows(5)}`)}</div><div>${card(`<h2>Lernzeit nach Fach</h2>${subjectRows()}`,'section')}${card(`<h2>Nächste Prüfung</h2>${upcoming?`<h3>${escapeHTML(subjectById(upcoming.subject).name)}</h3><p class="muted">${new Date(upcoming.date+'T12:00:00').toLocaleDateString('de-DE',{dateStyle:'long'})}</p><div class="kpi">${Math.ceil((new Date(upcoming.date+'T12:00:00')-new Date())/86400000)} Tage</div>`:'<div class="empty">Keine anstehende Prüfung.</div>'}`)}</div></div>`},
timer(){return `<div class="timerWrap">${card(`<div class="flex" style="justify-content:center"><button class="btn ${timer.mode==='stopwatch'?'':'secondary'}" onclick="setTimerMode('stopwatch')">Stoppuhr</button><button class="btn ${timer.mode==='pomodoro'?'':'secondary'}" onclick="setTimerMode('pomodoro')">Pomodoro</button></div><div class="timerRing"><div class="timerClock" id="timer-display">00:00</div></div><h2 id="timer-status">Bereit für deinen Fokus?</h2><p class="muted">Pausen werden nicht als Lernzeit gezählt.</p><div class="formgrid" style="text-align:left;margin:26px 0"><div><label>Fach</label><select id="timer-subject" onchange="timer.subject=this.value">${state.subjects.map(s=>`<option value="${s.id}" ${timer.subject===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}</select></div><div><label>Aktivität</label><select id="timer-activity" onchange="timer.activity=this.value">${['Aufgaben bearbeiten','Altklausur','Vorlesung nacharbeiten','Karteikarten','Zusammenfassung','Sonstiges'].map(a=>`<option ${timer.activity===a?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="flex timerControls"><button class="btn" id="start-btn" onclick="toggleTimer()">Starten</button><button class="btn secondary" onclick="resetTimer()">Zurücksetzen</button><button class="btn secondary" onclick="saveTimer()">Speichern</button></div>${timer.mode==='pomodoro'?'<div class="smalltext" style="margin-top:23px">25 Minuten Fokus · Anschließend eine Pause einlegen</div>':''}`)}</div>`},
sessions(){let total=state.sessions.reduce((a,s)=>a+Number(s.minutes),0);return `${card(`<div class="flex between"><div><h2>Dein Lerntagebuch</h2><p class="muted">${state.sessions.length} Einheiten · ${duration(total)}</p></div><button class="btn" onclick="openModal('session')">+ Hinzufügen</button></div>${sessionRows()}`)}`},
calendar(){let base=new Date();base.setDate(1);base.setMonth(base.getMonth()+monthShift);let year=base.getFullYear(),month=base.getMonth(),first=(new Date(year,month,1).getDay()+6)%7,last=new Date(year,month+1,0).getDate(),days=['Mo','Di','Mi','Do','Fr','Sa','So'];let cells=Array(first).fill('<div></div>');for(let n=1;n<=last;n++){let k=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,minutes=dayMinutes(k);cells.push(`<button class="day ${k===dateKey(new Date())?'today':''}" onclick="showDay('${k}')"><b>${n}</b>${minutes?`<span class="smalltext">${Math.round(minutes)} min</span><div class="mini" style="opacity:${Math.max(.3,Math.min(1,minutes/180))}"></div>`:''}</button>`)}return card(`<div class="flex between"><h2>${base.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h2><div class="flex"><button class="btn secondary small" onclick="changeMonth(-1)">←</button><button class="btn secondary small" onclick="changeMonth(0)">Heute</button><button class="btn secondary small" onclick="changeMonth(1)">→</button></div></div><div class="grid-days">${days.map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div><p class="muted">Klicke einen Tag an, um die dazugehörigen Lerneinheiten zu sehen.</p>`)},
subjects(){return card(`<div class="flex between"><h2>Deine Fächer</h2><button class="btn" onclick="openModal('subject')">+ Neues Fach</button></div>${state.subjects.map(s=>{let m=state.sessions.filter(e=>e.subject===s.id).reduce((a,e)=>a+Number(e.minutes),0);return `<div class="subject"><div class="dot" style="background:${s.color}"></div><div class="subject-name">${escapeHTML(s.name)}<div class="smalltext">${state.sessions.filter(e=>e.subject===s.id).length} Lerneinheiten</div></div><div class="subject-time">${duration(m)}</div><button class="remove" title="Fach löschen" onclick="removeSubject('${s.id}')">×</button></div>`}).join('')||'<div class="empty">Noch keine Fächer.</div>'}`)},
exams(){return card(`<div class="flex between"><h2>Deine Prüfungstermine</h2><button class="btn" onclick="openModal('exam')">+ Prüfung</button></div>${[...state.exams].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{let days=Math.ceil((new Date(e.date+'T12:00:00')-new Date())/86400000);return `<div class="exam"><div class="dot" style="background:${subjectById(e.subject).color}"></div><div><strong>${escapeHTML(subjectById(e.subject).name)}</strong><div class="smalltext">${new Date(e.date+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div class="countdown">${days<0?'Vergangen':days===0?'Heute':days+' Tage'}<div class="smalltext">${days<0?'':'verbleibend'}</div></div><button class="remove" title="Prüfung löschen" onclick="removeExam('${e.id}')">×</button></div>`}).join('')||'<div class="empty">Keine Prüfungen geplant.</div>'}`)},
analytics(){let total=state.sessions.reduce((a,s)=>a+Number(s.minutes),0),days=lastDays(14),active=days.filter(d=>dayMinutes(d)>0).length;return `<div class="cards">${card(`<div class="smalltext">Gesamte Lernzeit</div><div class="kpi">${duration(total)}</div>`)}${card(`<div class="smalltext">Alle Lerneinheiten</div><div class="kpi">${state.sessions.length}</div>`)}${card(`<div class="smalltext">Ø pro Einheit</div><div class="kpi">${state.sessions.length?Math.round(total/state.sessions.length):0} min</div>`)}${card(`<div class="smalltext">Aktive Tage (14 Tage)</div><div class="kpi">${active}/14</div>`)}</div><div class="layout2"><div>${card(`<h2>Lernzeit der letzten 7 Tage</h2>${barChart(lastDays(7))}`)}</div><div>${card(`<h2>Fachverteilung</h2>${subjectRows()}`)}</div></div>${card(`<h2>Aktivität der letzten 14 Wochen</h2><div class="heatmap">${lastDays(98).map(d=>{let m=dayMinutes(d);return `<div class="heatcell ${m>=180?'level3':m>=90?'level2':m>0?'level1':''}" title="${d}: ${duration(m)}"></div>`}).join('')}</div><p class="smalltext">Je heller das Feld, desto mehr hast du an diesem Tag gelernt.</p>`,'section')}`},
settings(){return card(`<h2>Wochenziel</h2><div class="field" style="max-width:220px"><label>Stunden pro Woche</label><input type="number" id="goal" min="1" max="100" value="${state.weeklyGoal}"></div><button class="btn" onclick="setGoal()">Ziel speichern</button><hr style="border:0;border-top:1px solid #30354b;margin:28px 0"><h2>Deine Daten</h2><p class="muted">Alle Daten liegen im lokalen Speicher deines Browsers. Erstelle regelmäßig eine Sicherung. Andere Browser oder Geräte synchronisieren nicht automatisch.</p><div class="flex"><button class="btn secondary" onclick="exportData()">↓ JSON exportieren</button><label class="btn secondary filebutton">↑ JSON importieren<input type="file" accept=".json,application/json" onchange="importData(event)"></label><button class="btn danger" onclick="resetAll()">Alle Daten löschen</button></div><p class="notice" style="margin-top:22px">Privat und offline nutzbar. Keine Anmeldung und kein kostenpflichtiges Abo.</p>`)}
};
function removeSession(id){if(confirm('Lerneinheit wirklich löschen?')){state.sessions=state.sessions.filter(s=>s.id!==id);persist();render()}}
function removeSubject(id){if(state.subjects.length===1)return alert('Mindestens ein Fach muss bleiben.');if(state.sessions.some(s=>s.subject===id)||state.exams.some(e=>e.subject===id))return alert('Dieses Fach wird noch von Lerneinheiten oder Prüfungen verwendet. Entferne diese zuerst.');if(confirm('Fach löschen?')){state.subjects=state.subjects.filter(s=>s.id!==id);persist();render()}}
function removeExam(id){if(confirm('Prüfung löschen?')){state.exams=state.exams.filter(e=>e.id!==id);persist();render()}}
function changeMonth(n){monthShift=n===0?0:monthShift+n;render()}
function showDay(d){let rows=state.sessions.filter(s=>s.date.slice(0,10)===d);$('#modal-root').innerHTML=`<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="flex between"><h2>${new Date(d+'T12:00:00').toLocaleDateString('de-DE',{dateStyle:'full'})}</h2><button class="remove" onclick="closeModal()">×</button></div><p>${duration(dayMinutes(d))} gelernt · ${rows.length} Einheiten</p>${rows.length?rows.map(s=>`<div class="subject"><div class="dot" style="background:${subjectById(s.subject).color}"></div><div class="subject-name">${escapeHTML(subjectById(s.subject).name)}<div class="smalltext">${escapeHTML(s.activity)}</div></div><span>${duration(s.minutes)}</span></div>`).join(''):'<p class="muted">Keine Lerneinheiten.</p>'}</div></div>`}
function openModal(type){let title={session:'Lerneinheit hinzufügen',subject:'Neues Fach',exam:'Prüfung hinzufügen'}[type];let form=type==='session'?`<div class="formgrid"><div class="field"><label>Fach</label><select name="subject" required>${state.subjects.map(s=>`<option value="${s.id}">${escapeHTML(s.name)}</option>`).join('')}</select></div><div class="field"><label>Datum & Uhrzeit</label><input name="date" type="datetime-local" value="${dateKey(new Date())}T${new Date().toTimeString().slice(0,5)}" required></div><div class="field"><label>Dauer in Minuten</label><input name="minutes" type="number" min="1" max="1440" value="60" required></div><div class="field"><label>Aktivität</label><select name="activity">${['Aufgaben bearbeiten','Altklausur','Vorlesung nacharbeiten','Karteikarten','Zusammenfassung','Sonstiges'].map(a=>`<option>${a}</option>`).join('')}</select></div></div><div class="field"><label>Notiz (optional)</label><textarea name="note" rows="2" placeholder="Was hast du geschafft?"></textarea></div>`:type==='subject'?`<div class="field"><label>Fachname</label><input name="name" maxlength="70" required placeholder="z. B. Mathematik"></div><div class="field"><label>Farbe</label><input name="color" type="color" value="#988cfa" style="height:45px;padding:4px"></div>`:`<div class="field"><label>Fach</label><select name="subject">${state.subjects.map(s=>`<option value="${s.id}">${escapeHTML(s.name)}</option>`).join('')}</select></div><div class="field"><label>Prüfungsdatum</label><input name="date" type="date" value="${dateKey(new Date())}" required></div>`;$('#modal-root').innerHTML=`<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="flex between"><h2>${title}</h2><button class="remove" onclick="closeModal()">×</button></div><form id="entry-form">${form}<div class="flex" style="justify-content:flex-end"><button type="button" class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form></div></div>`;$('#entry-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(type==='session')state.sessions.push({id:crypto.randomUUID(),subject:f.get('subject'),date:new Date(f.get('date')).toISOString(),minutes:Number(f.get('minutes')),activity:f.get('activity'),note:f.get('note')});else if(type==='subject')state.subjects.push({id:crypto.randomUUID(),name:f.get('name').trim(),color:f.get('color')});else state.exams.push({id:crypto.randomUUID(),subject:f.get('subject'),date:f.get('date')});persist();closeModal();render()}}
function closeModal(){$('#modal-root').innerHTML=''}
function elapsed(){if(timer.running)return timer.baseSeconds+Math.floor((Date.now()-timer.startAt)/1000);return timer.baseSeconds}
function clock(){let n=elapsed();if(timer.mode==='pomodoro')n=Math.max(0,timer.pomodoro-n);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function renderTimerLive(){let display=$('#timer-display');if(!display)return;display.textContent=clock();$('#timer-status').textContent=timer.running?'Du bist im Fokus!':elapsed()?'Pausiert':'Bereit für deinen Fokus?';$('#start-btn').textContent=timer.running?'Pausieren':elapsed()?'Fortsetzen':'Starten'}
function setTimerMode(mode){if(timer.running||elapsed()){if(!confirm('Laufenden Timer zurücksetzen und Modus wechseln?'))return}timer.mode=mode;timer.running=false;timer.baseSeconds=0;timer.startedAt=null;render()}
function toggleTimer(){if(timer.running){timer.baseSeconds=elapsed();timer.running=false}else{timer.startAt=Date.now();timer.running=true;timer.startedAt??=new Date().toISOString()}renderTimerLive()}
function resetTimer(){if(elapsed()&&!confirm('Timer ohne Speichern zurücksetzen?'))return;timer.running=false;timer.baseSeconds=0;timer.startedAt=null;renderTimerLive()}
function saveTimer(){let secs=elapsed();if(secs<30)return alert('Mindestens 30 Sekunden lernen, um eine Einheit zu speichern.');let minutes=Math.max(1,Math.round(Math.min(secs,timer.mode==='pomodoro'?timer.pomodoro:Infinity)/60));state.sessions.push({id:crypto.randomUUID(),subject:timer.subject,date:timer.startedAt||new Date().toISOString(),minutes,activity:timer.activity,note:''});persist();timer.running=false;timer.baseSeconds=0;timer.startedAt=null;alert(`${minutes} Minuten gespeichert!`);renderTimerLive()}
setInterval(()=>{if(tab==='timer')renderTimerLive();if(timer.running&&timer.mode==='pomodoro'&&elapsed()>=timer.pomodoro){timer.baseSeconds=timer.pomodoro;timer.running=false;renderTimerLive();try{if(Notification.permission==='granted')new Notification('Lernflow: Pomodoro abgeschlossen!')}catch{}}},500);
function setGoal(){let n=Number($('#goal').value);if(!Number.isInteger(n)||n<1||n>100)return alert('Bitte 1 bis 100 Stunden eingeben.');state.weeklyGoal=n;persist();render()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lernflow-backup-'+dateKey(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function importData(event){let file=event.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.subjects)||!Array.isArray(data.sessions)||!Array.isArray(data.exams)||!Number.isFinite(Number(data.weeklyGoal)))throw Error('Format');if(!confirm('Vorhandene lokale Daten durch dieses Backup ersetzen?'))return;state=data;timer.subject=state.subjects[0]?.id||'';persist();render();alert('Import erfolgreich.')}catch{alert('Das Backup hat kein gültiges Lernflow-Format.')}};reader.readAsText(file)}
function resetAll(){if(confirm('Wirklich ALLE lokalen Daten und Lerneinheiten löschen?')){state=defaultState();persist();render()}}
render();
</script></body></html>
